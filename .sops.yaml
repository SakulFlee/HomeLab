creation_rules:
  # The host's own secret store. Listed first and with all eight recipients
  # rather than the usual three, because this file's existing recipients do not
  # match any other rule in this file.
  #
  # It had NO rule at all until now, which is why it could not be edited with
  # `sops set`: sops resolves recipients from the creation rules and refused the
  # path. Adding one with only the usual three would have been worse than none --
  # the next re-encrypt would have quietly dropped five recipients and locked
  # those keys out. So the list below is the file's actual recipient set, copied
  # from its sops.age block, and it must stay that way.
  - path_regex: nixos/secrets\.yaml$
    key_groups:
      - age:
        - age1gsqf94w28l0rv8khatmwtx0tnakvafj7m0xrtl92axl6ecte5qgqxreytu
        - age1extqssdhtgu3ntpuvq5rkz8zfd20597de9g6y4uuxwf27ca7a3xqjvacrg
        - age1a3w7vvn728u7xsspluhffrggzyklgqervezhdamx7qn86c8v3dkq4x6zxy
        - age19tp8f5d84z5uyqdp86dyypwn0tt69yxrytj905xe73rglvz6r58smuesjt
        - age1nj55hvyhkf7202f6afpthufvdppylwxnxdxnn97xe8ylmc42lfhq6vknm2
        - age1cq75tzr7c55zd9w7ym7yy2srmvactsvgdmvd3mahlfnyh33da43sz70nhc
        # HomeLab (Host) -- derived from /etc/ssh/ssh_host_ed25519_key, so this is
        # the only recipient the server itself can decrypt with.
        - age16n3ufazps5tru37l4wny0sh4f7em63j22yuhlahhfhxu5kz2ufdsmer7mw
        # HomeLab (User)
        - age1suydyah5q07jdn7xrpt853pzt9ua3ygd7yuu4pys8g0caq2v6dhsmvwcwg
  - path_regex: clusters/.*\.yaml$
    key_groups:
      - age:
        # Flux (k3s cluster)
        - age1564t00zp3r69x0n7fxwadcgxv0n5v2rkqz77ry52t05q99d6wetqqmr6l6
