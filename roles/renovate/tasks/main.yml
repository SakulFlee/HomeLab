- name: Ensure dedicated system group exists
  ansible.builtin.group:
    name: "{{ renovate_user }}"
    state: present

- name: Ensure dedicated system user exists
  ansible.builtin.user:
    name: "{{ renovate_user }}"
    group: "{{ renovate_user }}"
    shell: /bin/false
    system: true
    create_home: true

- name: Install prerequisite system packages
  ansible.builtin.package:
    name:
      - curl
      - git
    state: present

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and de-armor NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_version }} nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js
  ansible.builtin.package:
    name: nodejs
    state: present

- name: Install Renovate CLI globally via npm
  community.general.npm:
    name: renovate
    global: true
    state: present

- name: Create configuration and base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ renovate_user }}"
    group: "{{ renovate_user }}"
    mode: '0750'
  loop:
    - "{{ renovate_config_dir }}"
    - "{{ renovate_base_dir }}"

- name: Deploy Renovate config.js
  ansible.builtin.template:
    src: config.js.j2
    dest: "{{ renovate_config_dir }}/config.js"
    owner: "{{ renovate_user }}"
    group: "{{ renovate_user }}"
    mode: '0600'

- name: Create Systemd Service for Renovate
  ansible.builtin.template:
    src: renovate.service.j2
    dest: /etc/systemd/system/renovate.service
    mode: '0644'
  notify: Reload systemd

- name: Create Systemd Timer for Renovate
  ansible.builtin.template:
    src: renovate.timer.j2
    dest: /etc/systemd/system/renovate.timer
    mode: '0644'
  notify: Reload systemd

- name: Flush handlers to apply systemd reloads immediately
  ansible.builtin.meta: flush_handlers

- name: Enable and start Renovate Systemd Timer
  ansible.builtin.systemd:
    name: renovate.timer
    enabled: true
    state: started
