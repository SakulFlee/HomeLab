- name: Create a system group for Forgejo
  ansible.builtin.group:
    name: forgejo
    system: true
    state: present

- name: Create a system user for Forgejo
  ansible.builtin.user:
    name: forgejo
    group: forgejo
    system: true
    shell: /bin/bash
    home: /var/lib/forgejo
    create_home: true

- name: Create required application directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: forgejo
    group: forgejo
    mode: '0755'
  loop:
    - /var/lib/forgejo
    - /var/lib/forgejo/data
    - /var/lib/forgejo/custom
    - /etc/forgejo

- name: Download official Forgejo binary
  ansible.builtin.get_url:
    url: "https://codeberg.org/forgejo/forgejo/releases/download/v{{ forgejo_version }}/forgejo-{{ forgejo_version }}-linux-amd64"
    dest: /usr/local/bin/forgejo
    mode: '0755'
    owner: root
    group: root
  notify: Restart Forgejo

- name: Configure Forgejo app.ini
  ansible.builtin.template:
    src: app.ini.j2
    dest: /etc/forgejo/app.ini
    owner: forgejo
    group: forgejo
    mode: '0600'
  notify: Restart Forgejo

- name: Deploy Forgejo Systemd Service Unit
  ansible.builtin.template:
    src: forgejo.service.j2
    dest: /etc/systemd/system/forgejo.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Forgejo

- name: Ensure Forgejo service is enabled and started
  ansible.builtin.systemd:
    name: forgejo
    state: started
    enabled: true
    daemon_reload: true
