- name: Install required system packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ssh
    state: present
    update_cache: true

- name: Ensure netcat-openbsd is installed for raw socket proxying
  ansible.builtin.package:
    name: netcat-openbsd
    state: present

- name: Create the unified system user 'git'
  ansible.builtin.user:
    name: git
    system: true
    shell: /bin/bash
    create_home: true
    home: /home/git
    password_lock: true

- name: Ensure correct permissions on the git home and .ssh directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: git
    group: git
    mode: '0700'
  loop:
    - /home/git
    - /home/git/.ssh

- name: Ensure the authorized_keys file exists with strict permissions
  ansible.builtin.file:
    path: /home/git/.ssh/authorized_keys
    state: touch
    owner: git
    group: git
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Create required application directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: git
    group: git
    mode: '0755'
  loop:
    - /var/lib/forgejo
    - /var/lib/forgejo/data
    - /var/lib/forgejo/custom
    - /etc/forgejo

- name: Download official Forgejo binary
  ansible.builtin.get_url:
    url: "https://codeberg.org/forgejo/forgejo/releases/download/v{{ forgejo_version }}/forgejo-{{ forgejo_version }}-linux-amd64"
    dest: /usr/local/bin/forgejo
    mode: '0755'
    owner: root
    group: root
  notify: Restart Forgejo

- name: Configure Forgejo app.ini
  ansible.builtin.template:
    src: app.ini.j2
    dest: /etc/forgejo/app.ini
    owner: git
    group: git
    mode: '0600'
  notify: Restart Forgejo

- name: Inject AuthorizedKeysCommand Match block into OpenSSH configuration
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED FORGEJO NATIVE LOOKUP"
    insertafter: EOF 
    block: |
      Match User git 
          AuthorizedKeysCommand /usr/local/bin/forgejo keys -c /etc/forgejo/app.ini -e git -u %u -t %t -k %k
          AuthorizedKeysCommandUser git
          AllowTcpForwarding no
          X11Forwarding no
  notify: Restart SSHD

- name: Deploy Forgejo Systemd Service Unit
  ansible.builtin.template:
    src: forgejo.service.j2
    dest: /etc/systemd/system/forgejo.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Forgejo

- name: Ensure Forgejo service is enabled and started
  ansible.builtin.systemd:
    name: forgejo
    state: started
    enabled: true
    daemon_reload: true
