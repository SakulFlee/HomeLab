- name: Create systemd override directory for SSH socket
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    mode: '0755'

- name: Configure SSH to use port 2222 via systemd socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/addresses.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream=2222
    mode: '0644'
  notify: Reload systemd and restart SSH socket

