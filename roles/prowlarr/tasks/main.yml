- name: Install required system packages
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true

- name: Create system group
  ansible.builtin.group:
    name: "prowlarr"
    system: true
    state: present

- name: Create system user
  ansible.builtin.user:
    name: "prowlarr"
    group: "prowlarr"
    system: true
    shell: /bin/bash
    home: "/var/lib/prowlarr"
    create_home: true
    password_lock: true

- name: Create required directory structure
  ansible.builtin.file:
    path: "/opt/Prowlarr"
    state: directory
    owner: "prowlarr"
    group: "prowlarr"
    mode: '0755'

- name: Download archive
  ansible.builtin.get_url:
    url: "http://prowlarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64"
    dest: /opt/Prowlarr/Prowlarr.tar.gz
    mode: '0755'
    owner: root
    group: root
  notify: Restart Prowlarr

- name: Extract archive
  ansible.builtin.unarchive:
    src: /opt/Prowlarr/Prowlarr.tar.gz
    dest: /opt/
    remote_src: yes

- name: Set owner
  ansible.builtin.file:
    path: /opt/Prowlarr/
    state: directory
    owner: prowlarr
    group: prowlarr
    recurse: yes

- name: Deploy systemd service
  ansible.builtin.template:
    src: prowlarr.service.j2
    dest: /etc/systemd/system/prowlarr.service
    owner: root
    group: root
    mode: '0644'

- name: Ensure service is enabled and started
  ansible.builtin.systemd:
    name: prowlarr
    state: started
    enabled: true
    daemon_reload: true
