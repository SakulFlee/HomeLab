dependencies:
  - role: docker
  - role: geerlingguy.postgresql
    vars:
      ansible_become_method: su
      db_password: "{{ vault_woodpecker_db_password }}"
      postgresql_users:
        - name: "woodpecker"
          password: "{{ vault_woodpecker_db_password }}"
      postgresql_databases:
        - name: "woodpecker"
          owner: "woodpecker"
      postgresql_global_config_options:
        - option: listen_addresses
          value: "127.0.0.1"
        - option: logging_collector
          value: "on"
        - option: log_directory
          value: "log"
