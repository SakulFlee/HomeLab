- name: Install requirements
  package:
    name: 
      - curl
      - screen
      - openjdk-25-jre-headless
    state: present

- name: Establish target system group
  group:
    name: "{{ hytale_group }}"
    state: present

- name: Provision restricted execution user accounts
  user:
    name: "{{ hytale_user }}"
    group: "{{ hytale_group }}"
    system: yes
    home: "{{ hytale_dir }}"
    create_home: no

- name: Initialize absolute paths and lock down ownership
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hytale_user }}"
    group: "{{ hytale_group }}"
    mode: '0755'
  loop:
    - "{{ hytale_dir }}"
    - "{{ hytale_server_downloader_dir }}"

- name: Download and extract hytale server downloader archive
  ansible.builtin.unarchive:
    src: "{{ hytale_server_downloader_url }}"
    dest: "{{ hytale_server_downloader_dir }}/"
    owner: "{{ hytale_user }}"
    group: "{{ hytale_group }}"
    mode: '0744'
    remote_src: true

- name: Deploy tailored systemd service unit definitions
  template:
    src: hytale.service.j2
    dest: /etc/systemd/system/hytale.service
    mode: '0644'
  notify: Reload systemd

- name: Flush handlers instantly to process systemd context refresh
  meta: flush_handlers

- name: Ensure persistent initialization state for the engine instance
  systemd:
    name: hytale
    enabled: yes
    state: started
