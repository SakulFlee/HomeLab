---
# qBittorrent configuration
qbittorrent_web_port: 8080
qbittorrent_download_dir: "/var/lib/qbittorrent/downloads"
qbittorrent_config_dir: "/var/lib/qbittorrent/.config/qBittorrent"
qbittorrent_user: qbittorrent
qbittorrent_group: qbittorrent
qbittorrent_home: "/var/lib/qbittorrent"

# PIA WireGuard interface name (default in PIA: wgpia0)
qbittorrent_vpn_interface: "wgpia0"

# Port monitor script
qbittorrent_port_monitor_interval: 60

# Password hash iterations
qbittorrent_pbkdf2_iterations: 100000
