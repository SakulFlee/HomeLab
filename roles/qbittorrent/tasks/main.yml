- name: Install required system packages
  ansible.builtin.apt:
    name:
      - qbittorrent-nox
    state: present
    update_cache: true

- name: Create qbittorrent system group
  ansible.builtin.group:
    name: "{{ qbittorrent_group }}"
    system: true
    state: present

- name: Create qbittorrent system user
  ansible.builtin.user:
    name: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_group }}"
    system: true
    shell: /bin/bash
    home: "{{ qbittorrent_home }}"
    create_home: true
    password_lock: true

- name: Create required directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_group }}"
    mode: '0755'
  loop:
    - "{{ qbittorrent_home }}"
    - "{{ qbittorrent_config_dir }}"
    - "{{ qbittorrent_download_dir }}"
    - "{{ qbittorrent_home }}/.cache/qBittorrent"

- name: Generate qBittorrent Web UI password hash
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import hashlib, base64, os, struct
      password = '{{ vault_qbittorrent_web_password }}'
      salt = os.urandom(32)
      iterations = {{ qbittorrent_pbkdf2_iterations }}
      key = hashlib.pbkdf2_hmac('sha512', password.encode('utf-8'), salt, iterations)
      result = base64.b64encode(salt + struct.pack('>I', iterations) + key).decode()
      print(result)
      "
  register: _qb_password_hash_result
  changed_when: false
  no_log: true

- name: Set qb_password_hash fact
  ansible.builtin.set_fact:
    qb_password_hash: "{{ _qb_password_hash_result.stdout }}"

- name: Deploy qBittorrent config
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ qbittorrent_config_dir }}/qBittorrent.conf"
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_group }}"
    mode: '0600'
  notify: Restart qBittorrent

- name: Deploy qbittorrent systemd service
  ansible.builtin.template:
    src: qbittorrent.service.j2
    dest: /etc/systemd/system/qbittorrent.service
    owner: root
    group: root
    mode: '0644'

- name: Deploy PIA port monitor script
  ansible.builtin.template:
    src: pia-port-monitor.py.j2
    dest: /usr/local/bin/pia-port-monitor.py
    owner: root
    group: root
    mode: '0755'

- name: Deploy PIA port monitor systemd service
  ansible.builtin.template:
    src: pia-port-monitor.service.j2
    dest: /etc/systemd/system/pia-port-monitor.service
    owner: root
    group: root
    mode: '0644'

- name: Ensure PIA port monitor is enabled and started
  ansible.builtin.systemd:
    name: pia-port-monitor
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure qbittorrent service is enabled and started
  ansible.builtin.systemd:
    name: qbittorrent
    state: started
    enabled: true
    daemon_reload: true
