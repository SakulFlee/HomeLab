- name: Install required system packages
  ansible.builtin.apt:
    name:
      - curl 
      - sqlite3
    state: present
    update_cache: true

- name: Create system group
  ansible.builtin.group:
    name: "radarr"
    system: true
    state: present

- name: Create system user
  ansible.builtin.user:
    name: "radarr"
    group: "radarr"
    system: true
    shell: /bin/bash
    home: "/var/lib/radarr"
    create_home: true
    password_lock: true

- name: Create required directory structure
  ansible.builtin.file:
    path: "/opt/radarr"
    state: directory
    owner: "radarr"
    group: "radarr"
    mode: '0755'

- name: Extract archive
  ansible.builtin.unarchive:
    src: "http://radarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=x64"
    dest: /opt/Radarr/
    creates: /opt/Radarr/Radarr
    remote_src: yes
  notify: Restart Radarr

- name: Set owner
  ansible.builtin.file:
    path: /opt/Radarr/
    state: directory
    owner: radarr
    group: radarr
    recurse: yes

- name: Deploy systemd service
  ansible.builtin.template:
    src: radarr.service.j2
    dest: /etc/systemd/system/radarr.service
    owner: root
    group: root
    mode: '0644'

- name: Ensure service is enabled and started
  ansible.builtin.systemd:
    name: radarr
    state: started
    enabled: true
    daemon_reload: true
