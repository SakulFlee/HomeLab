apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unsloth
  namespace: flux-system
spec:
  interval: 30m0s
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: unsloth
  timeout: 10m0s
  wait: true
  path: ./apps/unsloth/
  dependsOn:
    - name: unsloth-secrets
