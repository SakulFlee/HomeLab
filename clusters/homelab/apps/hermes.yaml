apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  interval: 30m0s
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: hermes
  timeout: 3m0s
  wait: true
  path: ./apps/hermes/
  # No dependsOn on hermes-secrets: this Kustomization creates the `hermes`
  # namespace that the Secret lives in, so depending on it would deadlock on a
  # fresh cluster. hermes-secrets retries every 2m until the namespace exists,
  # and the pod waits on the Secret in CreateContainerConfigError meanwhile.
