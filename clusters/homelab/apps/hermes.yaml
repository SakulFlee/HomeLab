apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  interval: 30m0s
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: hermes
  timeout: 3m0s
  wait: true
  path: ./apps/hermes/
  # Pods reference hermes-secrets by secretKeyRef; create it first so the
  # Deployment does not sit in CreateContainerConfigError waiting for it.
  dependsOn:
    - name: hermes-secrets
