apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
spec:
  # local-path-backup, not local-path-persistent: restic backs up ONLY the
  # backup tier (apps/storage-class/restic-daemonset.yaml backs up
  # /var/lib/rancher/k3s/storage/backup and says explicitly that it does
  # NOT snapshot local-path-persistent). This volume holds accounts, chats
  # and the RAG vector index, so it is the tier that matters.
  storageClassName: local-path-backup
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Users and chat history are small; the vector index for RAG is what
      # grows. Uploads count against this too.
      storage: 10Gi
