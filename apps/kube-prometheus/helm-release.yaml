apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  releaseName: kube-prometheus
  targetNamespace: kube-prometheus
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    grafana:
      replicas: 1
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: media-vpn-only@kubernetescrd
        hosts:
          - grafana.sakul-flee.de
        tls:
          - secretName: grafana-sakul-flee-de-tls
            hosts:
              - grafana.sakul-flee.de
      admin:
        existingSecret: kube-prometheus-secret
        userKey: username
        passwordKey: password
      persistence:
        enabled: true
        storageClassName: local-path-backup
    alertmanager:
      alertmanagerSpec:
        replicas: 1
    prometheus:
      prometheusSpec:
        replicas: 1
