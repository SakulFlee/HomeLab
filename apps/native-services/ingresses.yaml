apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llama-swap
  namespace: native
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: llama-swap.sakul-flee.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llama-swap
                port:
                  number: 80
  tls:
    - hosts:
        - llama-swap.sakul-flee.de
      secretName: llama-swap-sakul-flee-de-tls