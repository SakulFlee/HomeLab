apiVersion: v1
kind: ConfigMap
metadata:
  name: cinny-config
  namespace: synapse
data:
  config.json: |
    {
      "defaultHomeserver": 0,
      "homeserverList": [
        "matrix.sakul-flee.de"
      ],
      "allowCustomHomeservers": false,
      "featuredCommunities": {
        "openAsDefault": false,
        "spaces": [],
        "rooms": [],
        "servers": []
      },
      "hashRouter": {
        "enabled": false,
        "basename": "/"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinny-web
  namespace: synapse
  labels:
    app: cinny-web
spec:
  selector:
    matchLabels:
      app: cinny-web
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cinny-web
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: cinny-config
      containers:
        - name: cinny
          image: ghcr.io/cinnyapp/cinny:v4.4.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.json
              subPath: config.json
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cinny-web
  namespace: synapse
spec:
  type: ClusterIP
  selector:
    app: cinny-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinny-web
  namespace: synapse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: cinny.sakul-flee.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinny-web
                port:
                  number: 80
  tls:
    - hosts:
        - cinny.sakul-flee.de
      secretName: cinny-sakul-flee-de-tls