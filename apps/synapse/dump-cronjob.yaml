apiVersion: batch/v1
kind: CronJob
metadata:
  name: synapse-pg-dump
  namespace: synapse
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18-alpine
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: host
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: port
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: user
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgres-app
                      key: dbname
              command:
                - /bin/sh
                - -ec
                - |
                  DATE=$(date +%Y%m%d-%H%M%S)
                  pg_dump -Fc -f "/dumps/$PGDATABASE-$DATE.dump"
                  find /dumps -name '*.dump' -type f -mmin +2880 -delete
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: synapse-pg-dumps
