apiVersion: v1
kind: ConfigMap
metadata:
  name: element-config
  namespace: synapse
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.sakul-flee.de",
          "server_name": "matrix.sakul-flee.de"
        },
        "m.identity_server": {
          "base_url": "https://vector.im"
        }
      },
      "disable_custom_urls": false,
      "disable_guests": false,
      "disable_login_language_selector": false,
      "disable_3pid_login": false,
      "brand": "Element",
      "integrations_ui_url": "https://scalar.vector.im/",
      "integrations_rest_url": "https://scalar.vector.im/api",
      "integrations_widgets_urls": [
        "https://scalar.vector.im/_matrix/integrations/v1",
        "https://scalar.vector.im/api",
        "https://scalar-staging.vector.im/_matrix/integrations/v1",
        "https://scalar-staging.vector.im/api"
      ],
      "bug_report_endpoint_url": "https://rageshakes.element.io/api/submit",
      "defaultCountryCode": "DE",
      "show_labs_settings": false,
      "features": {},
      "default_federate": true,
      "default_theme": "dark",
      "room_directory": {
        "servers": [
          "matrix.sakul-flee.de"
        ]
      },
      "setting_defaults": {
        "breadcrumbs": true
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: synapse
  labels:
    app: element-web
spec:
  selector:
    matchLabels:
      app: element-web
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: element-web
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: element-config
      containers:
        - name: element
          image: vectorim/element-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ELEMENT_WEB_PORT
              value: "80"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.json
              subPath: config.json
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: element-web
  namespace: synapse
spec:
  type: ClusterIP
  selector:
    app: element-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: element-web
  namespace: synapse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: element.sakul-flee.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: element-web
                port:
                  number: 80
  tls:
    - hosts:
        - element.sakul-flee.de
      secretName: element-sakul-flee-de-tls