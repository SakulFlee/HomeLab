apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: '@hourly'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:43-full
              args: []
              env:
                - name: LOG_LEVEL
                  value: debug
                # Orbital and HomeLab both vendor a Rust crate / operator via
                # git submodules. Without this the submodule is an empty
                # directory, which breaks the cargo workspace ("failed to read
                # Crates/orbital-iced/core/Cargo.toml") and means the
                # git-submodules manager has no checkout to move.
                - name: RENOVATE_CLONE_SUBMODULES
                  value: 'true'
              envFrom:
                - secretRef:
                    name: renovate-env
          restartPolicy: Never
