apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  interval: 15m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  releaseName: forgejo-runner
  targetNamespace: forgejo-runner
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
  values:
    # 0 replicas. The runner now runs in an Incus VM (hosts/forgejo-runner),
    # with the Docker executor replacing this chart's k8s plugin.
    #
    # Worth noting WHY this was worth doing rather than just tidying: this runner
    # was live and pointed at http://forgejo-http.forgejo.svc.cluster.local:3000,
    # a Service with no endpoints since Forgejo left the cluster. So it was
    # polling for jobs it could never run, and any job it did pick up would have
    # failed in the k8s plugin -- the one failure mode that looks like a broken
    # CI system rather than a retired one.
    replicaCount: 0
    forgejo:
      url: "http://forgejo-http.forgejo.svc.cluster.local:3000"
      existingSecret: "forgejo-runner-secret"
    image:
      repository: registry.erwanleboucher.dev/eleboucher/runner
      tag: "12.13.0"
    plugin:
      image:
        repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
        tag: "12.10.9"
    runnerConfig: |
      runner:
        capacity: 4
        timeout: "4h"
        shutdown_timeout: "3m"
        labels:
          - "ubuntu-latest:k8s:/config/podspec-default.yaml"
          - "ubuntu-24.04:k8s:/config/podspec-default.yaml"
          - "default:k8s:/config/podspec-default.yaml"
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo-runner
            poll_timeout: 10m
            labels: "app.kubernetes.io/name=forgejo-runner-instance"
            resources: |
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
                cpu: 1000m
      cache:
        enabled: true
        dir: "/data/cache"
      log:
        level: info
    podSpecs:
      podspec-default.yaml: |
        automountServiceAccountToken: false
        containers:
          - name: main
            image: node:22-bookworm
            imagePullPolicy: IfNotPresent
            env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
                cpu: 1000m
        restartPolicy: Never
    serviceAccount:
      create: true
