apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-access-server-config
  namespace: wireguard
data:
  config.yaml: |
    loglevel: info
    storage: sqlite3:///data/db.sqlite3
    # Endpoint written into client configs. Resolves via an explicit
    # DNS-only A record (public IP, kept current by cloudflare-ddns).
    # The proxied *.sakul-flee.de wildcard would answer Cloudflare edge
    # IPs, which UDP 51820 cannot traverse (requires UDP 51820
    # forwarded to .200 on the router).
    externalHost: wg.sakul-flee.de
    https:
      # TLS is terminated by Traefik, no self-signed listener needed.
      enabled: false
    wireguard:
      port: 51820
    vpn:
      # Slice of the old tailnet range so the wireguard-vpn-only
      # Traefik allow-list (100.64.0.0/10) keeps working unchanged.
      cidr: 100.64.0.0/24
      cidrv6: "0"
      # Split tunnel: VPN subnet + LAN + the Incus bridge (replaces the old
      # subnet-router --advertise-routes=192.168.178.0/24).
      #
      # This list does double duty, and the second job is the non-obvious one.
      # wg-access-server generates a forwarding guard from it:
      #
      #   ip saddr 100.64.0.0/24 ip daddr 100.64.0.0/10   accept
      #   ip saddr 100.64.0.0/24 ip daddr 192.168.178.0/24 accept
      #   ip saddr 100.64.0.0/24 ip daddr 100.64.0.1      accept
      #   ip saddr 100.64.0.0/24                          reject
      #
      # Every accept matches on `ip daddr`, i.e. the destination as the client
      # asked for it. But Incus DNATs in the `prerouting` hook at priority
      # dstnat, so by the time a forwarded packet reaches the `forward` hook its
      # destination has already been rewritten. A VPN client dialling
      # 192.168.178.200:443 is forwarded with daddr 10.0.0.100, matches none of
      # those rules, and falls into the `reject` -- which emits ICMP
      # port-unreachable, i.e. ERR_CONNECTION_REFUSED on a phone.
      #
      # That is why the whole VPN broke for every proxied hostname when the Caddy
      # cutover landed: before it, :80 and :443 were locally delivered (Traefik
      # binds 0.0.0.0 on the host) and never met this chain at all. Only 22 and
      # 8443 still worked, because those are locally delivered too. LAN clients
      # were unaffected because their source is not 100.64.0.0/24, so no rule in
      # the chain matches and FORWARD's own `policy accept` takes them.
      #
      # Listing 10.0.0.0/24 here makes wg-access-server generate the accept that
      # the DNAT'd traffic needs. Editing the ruleset directly would not survive:
      # the chain is regenerated whenever the pod restarts.
      #
      # This does mean VPN clients can reach the container subnet directly rather
      # than only through Caddy. That is not an escalation -- the Incus vhost's
      # gate admits 100.64.0.0/10 anyway, and the Incus API still demands a
      # trusted client certificate -- but it does mean Caddy is no longer the
      # sole path to a container, which matters more once apps run in them.
      allowedIPs:
        - 100.64.0.0/10
        - 192.168.178.0/24
        - 10.0.0.0/24
    dns:
      # wg-access-server's embedded DNS forwarder stays off: it cannot
      # serve custom records and would collide with the split-horizon
      # CoreDNS sidecar on :53 (both share the host network).
      enabled: false
    clientConfig:
      # Split-horizon resolver (CoreDNS sidecar, 192.168.178.200:53):
      # private answers for VPN-only service names, everything else
      # forwarded upstream. The address is inside AllowedIPs, so all
      # client DNS travels through the tunnel (no leaks) and is only
      # reachable from the LAN or via the VPN. A single server on
      # purpose: a fallback resolver could race public answers against
      # split answers and surface Cloudflare addresses to clients.
      dnsServers:
        - 192.168.178.200
      PersistentKeepalive: 25
