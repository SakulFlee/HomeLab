apiVersion: v1
kind: ConfigMap
metadata:
  # v2: adds `ollama` to the allowlist and drops the retired `unsloth` /
  # `llama-swap`. The rename is what rolls the pod -- changing a ConfigMap's
  # contents restarts nothing by itself, and this CoreDNS had no `reload`
  # plugin at the time, so the edit would have sat on disk unparsed. With
  # `reload` in the Corefile now, later edits need no rename.
  name: wireguard-split-dns-v2
  namespace: wireguard
data:
  Corefile: |
    .:53 {
        bind 192.168.178.200
        # Split horizon. VPN-only service names resolve to the cluster
        # host so that VPN clients route them into the tunnel and reach
        # Traefik with a 100.64.0.x source (wireguard-vpn-only
        # middleware). Public resolvers never see these answers; they
        # fall back to the proxied *.sakul-flee.de wildcard. AAAA and
        # HTTPS are suppressed for the same names so clients cannot
        # prefer a Cloudflare edge address (which would bypass the
        # tunnel and be rejected by the middleware).
        #
        # Every VPN-only ingress hostname must be listed in ALL THREE
        # match regexes below, in lockstep with apps/*/ingress.yaml. A name
        # left out falls through to the proxied *.sakul-flee.de wildcard,
        # reaches Traefik from a Cloudflare edge IP instead of 100.64.0.x
        # and is rejected with 403 Forbidden even for a connected client.
        template IN A {
            match "^(hermes-dashboard|hermes|ollama|open-webui|jellyfin|sonarr|radarr|prowlarr|qbittorrent|qui|grafana|paperless|syncthing|nas|vpn|pvc-explorer)\.sakul-flee\.de\.$"
            answer "{{ .Name }} 60 IN A 192.168.178.200"
            fallthrough
        }
        template IN AAAA {
            match "^(hermes-dashboard|hermes|ollama|open-webui|jellyfin|sonarr|radarr|prowlarr|qbittorrent|qui|grafana|paperless|syncthing|nas|vpn|pvc-explorer)\.sakul-flee\.de\.$"
            rcode NOERROR
            fallthrough
        }
        template IN HTTPS {
            match "^(hermes-dashboard|hermes|ollama|open-webui|jellyfin|sonarr|radarr|prowlarr|qbittorrent|qui|grafana|paperless|syncthing|nas|vpn|pvc-explorer)\.sakul-flee\.de\.$"
            rcode NOERROR
            fallthrough
        }
        # Everything else (public names, wg endpoint, internet) goes
        # upstream unchanged.
        forward . 9.9.9.9 149.112.112.112
        cache
        errors
        # Without this, editing this ConfigMap rewrites Corefile on disk and
        # CoreDNS goes on serving the config it parsed at startup -- the file
        # and the running server silently disagree, and a name added to the
        # regexes above appears to do nothing. reload re-parses on change
        # (kubelet's atomic ..data symlink swap included) within ~30s.
        # Note the ~60s that the `cache` plugin can then hold a stale answer.
        reload
    }
