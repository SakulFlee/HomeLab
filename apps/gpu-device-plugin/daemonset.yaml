apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - image: squat/generic-device-plugin:latest
          name: generic-device-plugin
          args:
            - --device
            - |
              name: dri
              groups:
                - count: 4
                  paths:
                    - path: /dev/dri/renderD128
                    - path: /dev/dri/card0
                - count: 4
                  paths:
                    - path: /dev/dri/renderD129
                    - path: /dev/dri/card1
            # Without this the container device cgroup denies /dev/kfd with
            # EPERM even for root - mounting it via hostPath is not enough.
            # Consumed by Unsloth Studio, which requests devic.es/rocm and
            # devic.es/dri together (Jellyfin/llama-swap keep using dri only).
            - --device
            - |
              name: rocm
              groups:
                - count: 4
                  paths:
                    - path: /dev/kfd
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate