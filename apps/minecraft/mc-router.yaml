apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: mc-router
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: minecraft-server-charts
      interval: 5m
  releaseName: mc-router
  targetNamespace: minecraft
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    deploymentStrategy:
      type: Recreate
    minecraftRouter:
      autoScale:
        up:
          enabled: true
        down:
          enabled: true
          # Shut down after 10 minutes without connections
          after: "10m"
    services:
      minecraft:
        type: NodePort
        port: 25565
    resources:
      requests:
        memory: 50Mi
        cpu: 100m
      limits:
        memory: 100Mi
        cpu: 250m