apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: minecraft
      version: 5.x
      sourceRef:
        kind: HelmRepository
        name: minecraft-server-charts
      interval: 5m
  releaseName: minecraft
  targetNamespace: minecraft
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/replicas]
        target:
          kind: StatefulSet
  values:
    dnsPolicy: ClusterFirst
    dnsConfig:
      options:
        - name: ndots
          value: '1'
    workloadAsStatefulSet: true
    strategyType: OnDelete
    # Server sleeps at 0 replicas; mc-router wakes it on connection.
    # Annotations register the service with mc-router's auto-discovery.
    replicaCount: 0
    serviceAnnotations:
      mc-router.itzg.me/externalServerName: "minecraft.sakul-flee.de,mc.sakul-flee.de,homelab.local,192.168.178.200"
      mc-router.itzg.me/defaultServer: "true"
      mc-router.itzg.me/autoScaleWaitTimeout: "30s"
      mc-router.itzg.me/autoScaleAsleepMOTD: "Server is asleep - joining wakes it up"
    minecraftServer:
      eula: 'TRUE'
      version: LATEST
      type: PAPER
      difficulty: normal
      whitelist: SakulFlee,jendrik12799,Lennart116002,Fisch246,DarkRune2214,_MinaChan_,Froggy189
      ops: SakulFlee,jendrik12799
      motd: Conduit Network @ SakulFlee
      serviceType: ClusterIP
      pluginUrls:
        - https://hangarcdn.papermc.io/plugins/KingTheGuy/Portalis/versions/1.0/PAPER/portalis-1.0.jar
        - https://hangarcdn.papermc.io/plugins/EngineHub/WorldEdit/versions/7.3.17/PAPER/worldedit-bukkit-7.3.17.jar
        - https://hangarcdn.papermc.io/plugins/kennytv/WorldEditSUI/versions/1.7.4/PAPER/WorldEditSUI-1.7.4.jar
    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 2048Mi
        cpu: 2000m
    persistence:
      storageClass: local-path-backup
      dataDir:
        enabled: true
        Size: 8Gi
