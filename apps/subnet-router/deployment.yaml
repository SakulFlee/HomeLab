apiVersion: apps/v1
kind: Deployment
metadata:
  name: subnet-router
  namespace: subnet-router
  labels:
    app: subnet-router
spec:
  selector:
    matchLabels:
      app: subnet-router
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: subnet-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: homelab
      volumes:
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: subnet-router-state
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.96.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              tailscaled \
                --state=/var/lib/tailscale/tailscaled.state \
                --tun=tailscale0 \
                --socket=/tmp/tailscaled.sock &
              sleep 4
              tailscale \
                --socket=/tmp/tailscaled.sock \
                up \
                --login-server=https://headscale.sakul-flee.de \
                --authkey="$TS_AUTHKEY" \
                --advertise-routes=192.168.178.0/24 \
                --accept-routes \
                --snat-subnet-routes=false \
                --hostname=homelab-router

              # Forward tailnet traffic destined for the router's tailnet IP
              # (100.64.0.9) on port 443 to Traefik on the host LAN IP.
              # Source IP is preserved (no SNAT), so Traefik's vpn-only
              # middleware sees the client's 100.64.x.x tailnet address.
              ROUTER_IP=$(tailscale --socket=/tmp/tailscaled.sock ip -4)
              iptables-nft -t nat -C PREROUTING -d "$ROUTER_IP" -p tcp --dport 443 -j DNAT --to-destination 192.168.178.200:443 2>/dev/null || \
                iptables-nft -t nat -A PREROUTING -d "$ROUTER_IP" -p tcp --dport 443 -j DNAT --to-destination 192.168.178.200:443

              tailscale --socket=/tmp/tailscaled.sock status
              sleep infinity
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: subnet-router-auth
                  key: authkey
          securityContext:
            privileged: true
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale