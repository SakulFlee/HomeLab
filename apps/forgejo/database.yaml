apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: forgejo
spec:
  # Left at 1. This is the PostgreSQL the in-cluster Forgejo used -- the live one
  # is in the Incus container's own volume -- so it is dead weight, but it cannot
  # be parked: postgresql.cnpg.io's Cluster declares instances as an integer with
  # minimum 1 (read from cloudnative-pg's own CRD), and its spec has no
  # suspend/enabled/paused field at any level. The only declarative route to 0
  # instances is deleting the Cluster object, and surviving PVCs do not make that
  # safe enough for a database being kept as the way back.
  instances: 1
  storage:
    storageClass: local-path-persistent
    size: 2Gi
