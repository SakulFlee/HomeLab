apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: syncthing
      version: 5.1.*
      sourceRef:
        kind: HelmRepository
        name: syncthing
      interval: 5m
  releaseName: syncthing
  targetNamespace: syncthing
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    # Run Syncthing as root so it can read/write the root-owned restic
    # repository (/var/lib/backups/repo). The syncthing/syncthing image's
    # entrypoint drops privileges to ${PUID}:${PGID} (image defaults 1000:1000)
    # regardless of the pod securityContext, so BOTH are required: start the
    # container as root AND set PUID/PGID=0 so the entrypoint keeps it as root.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    env:
      PUID: "0"
      PGID: "0"
    persistence:
      config:
        enabled: true
        storageClass: local-path-persistent
        size: 1Gi
        mountPath: /var/syncthing
      restic-repo:
        enabled: true
        type: hostPath
        # The local restic repository. Syncthing replicates this folder to a
        # peer device for off-box backup redundancy.
        hostPath: /var/lib/backups/
        mountPath: /var/lib/backups/
        retain: true
      data:
        enabled: true
        # App data tier: for Syncthing folders whose data should be retained
        # and covered by restic (in addition to the restic repo which is
        # already replicated via the restic-repo hostPath mount above).
        type: pvc
        storageClass: local-path-persistent
        accessMode: ReadWriteOnce
        size: 64Gi
        mountPath: /data
    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 8384
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: syncthing.sakul-flee.de
            paths:
              - path: /
                pathType: Prefix
                port: http
        tls:
          - secretName: syncthing-sakul-flee-de-tls
            hosts: [syncthing.sakul-flee.de]
