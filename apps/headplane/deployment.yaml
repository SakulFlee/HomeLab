apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: headplane
  labels:
    app: headplane
spec:
  selector:
    matchLabels:
      app: headplane
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: headplane
    spec:
      volumes:
        - name: secrets
          secret:
            secretName: headplane-secrets
        - name: data
          emptyDir: {}
      containers:
        - name: headplane
          image: ghcr.io/tale/headplane:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Berlin
            - name: HEADPLANE_CONFIG_PATH
              value: /etc/headplane/config.yaml
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: secrets
              mountPath: /etc/headplane/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/headplane