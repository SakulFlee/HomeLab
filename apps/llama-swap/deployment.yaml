apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-swap
  namespace: llama-swap
  labels:
    app: llama-swap
spec:
  selector:
    matchLabels:
      app: llama-swap
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-swap
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab
      volumes:
        - name: dev-dri
          hostPath:
            path: /dev/dri
        - name: config
          configMap:
            name: llama-swap-config
        - name: models
          persistentVolumeClaim:
            claimName: llama-swap-models
      containers:
        - name: llama-swap
          # Versioned tag, not :vulkan. The floating tag moves daily and
          # IfNotPresent never re-pulls a tag the node already has cached, so
          # :vulkan silently froze this pod on whatever it first pulled. The
          # -bNNNNN suffix is the bundled llama.cpp build; bump both together.
          image: ghcr.io/mostlygeek/llama-swap:v258-vulkan-b11176
          imagePullPolicy: IfNotPresent
          command:
            - /app/llama-swap
            - -config
            - /app/config/config.yaml
            - --watch-config
          resources:
            limits:
              devic.es/dri: "1"
              # Was 40Gi, more than the node has (30.6G). A limit above node
              # capacity meant llama-swap could never be OOM-killed itself;
              # the kernel instead picked whatever it liked (risking hytale,
              # prometheus, ...). 24Gi sits above the largest resident model
              # (~17.5G) and below node size, so an over-large model OOMs
              # this container instead of the node.
              memory: 24Gi
            requests:
              memory: 4Gi
          env:
            - name: HOME
              value: /root
            - name: LLAMA_ARG_HOST
              value: 0.0.0.0
            # llama-swap passes its environment to every llama-server it
            # spawns, so this is where backend-level knobs belong.
            #
            # The symptom these address is a model that emits ONE character
            # forever. llama.cpp #10734 reports "#" on an RTX 4080 and
            # repeated tabs on an AMD 7900GRE under RADV, both fixed by
            # disabling coopmat -- which is exactly MiniCPM5-2B's "))))))))".
            #
            # Why it can hit this card: coopmat was scoped to "AMD RX 7000
            # series and newer" in PR #10597, and this is an RDNA2 680M
            # (gfx1035) with no matrix cores. The guard that does exist
            # (PR #11074, "device-specific blacklist for coopmat") targets
            # the AMD *proprietary* driver by device name, so RADV here is
            # neither excluded nor validated.
            #
            # Cost: prompt-processing speed, on hardware that likely never
            # had the matrix units anyway. Both flags are present in the
            # bundled libggml-vulkan.so (build 11176) -- verified, no
            # rebuild required.
            - name: GGML_VK_DISABLE_COOPMAT
              value: "1"
            - name: GGML_VK_DISABLE_COOPMAT2
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: dev-dri
              mountPath: /dev/dri
            # No subPath: kubelet only refreshes subPath mounts from the pod's
            # start, so a ConfigMap edit never reached the process and
            # --watch-config (2s poll) had nothing to notice. Mounting the
            # whole ConfigMap keeps /app/config/config.yaml live.
            - name: config
              mountPath: /app/config
            - name: models
              mountPath: /root/.cache