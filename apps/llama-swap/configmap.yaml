apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: llama-swap
data:
  config.yaml: |
    healthCheckTimeout: 500
    logLevel: info
    logTimeFormat: ""
    logToStdout: "proxy"
    metricsMaxInMemory: 1000
    captureBuffer: 15
    sendLoadingState: true
    globalTTL: 0
    # Was 10s. Hermes drives these models across multi-step agent turns, so a
    # 10s idle eviction paid a reload on nearly every turn. Only one model can
    # be resident anyway (RAM budget), so this never loads two at once -- it
    # just keeps the current one warm for 5 min after the last request.
    unloadTimeout: 300

    macros:
      # -c lives per-model, not here: KV cache is the #2 RAM consumer and the
      # old shared 65536 made every model pay for 64k of it. -fit on lets
      # llama-server trim offload/ctx itself to the Vulkan heap.
      "base":
        /app/llama-server --host 127.0.0.1 --port ${PORT} -fa on -fit on
      # ~16G node budget: <=12B class gets 32k, 26B/35B class gets 16k.
      "ctx_m": "-c 32768"
      "ctx_l": "-c 16384"
      # Needs nextn tensors or an mtp-*.gguf sidecar (auto-downloaded from the
      # same repo on first load). See README for the per-model MTP matrix.
      "mtp": "--spec-type draft-mtp"
      # North has no MTP anywhere on HF; ngram speculation needs no draft
      # weights at all and only pays off on repetitive/structured output.
      "ngram": "--spec-type ngram-mod"

    models:
      # --- <=12B: fast, 32k ctx, ~7-8G resident ----------------------------
      "Gemma4 12B @UD-Q4_K_XL [QAT MTP]":
        cmd: |
          ${base}
          ${ctx_m}
          ${mtp}
          -hf unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
      "Qwen3.5 9B @UD-Q4_K_XL [MTP]":
        cmd: |
          ${base}
          ${ctx_m}
          ${mtp}
          --spec-draft-n-max 6
          -hf unsloth/Qwen3.5-9B-MTP-GGUF:UD-Q4_K_XL
      "Ornith-1.5 9B @Q4_K_M [MTP]":
        cmd: |
          ${base}
          ${ctx_m}
          ${mtp}
          -hf ornith-ai/Ornith-1.5-9B-GGUF:Q4_K_M
      "MiMo-V2.6-Distill-9B @Q4_K_M [MTP]":
        cmd: |
          ${base}
          ${ctx_m}
          ${mtp}
          -hf VitreousCut/MiMo-V2.6-Distill-Qwen-9B-MTP-GGUF:Q4_K_M

      # --- 26B/35B: 16k ctx, ~16-17G resident each, one at a time ---------
      # QAT ships only UD-Q4_K_XL (14.25G). If this OOMs on load, fall back to
      # non-QAT unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q3_K_XL (12.9G -> ~14.6G).
      "Gemma4 26B-A4B @UD-Q4_K_XL [QAT MTP]":
        cmd: |
          ${base}
          ${ctx_l}
          ${mtp}
          --spec-draft-n-max 4
          -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
      # No MTP exists for North (zero nextn tensors, no MTP repo on HF).
      # If this OOMs, fall back to UD-Q3_K_M (14.2G instead of 15.5G).
      "North-Mini-Code @UD-IQ4_NL [ngram]":
        cmd: |
          ${base}
          ${ctx_l}
          ${ngram}
          -hf unsloth/North-Mini-Code-1.0-GGUF:UD-IQ4_NL
      # UD-Q4_K_XL is 22.9G (won't fit). If this OOMs, fall back to
      # UD-IQ3_XXS (14.1G instead of 15.4G).
      "Qwen3.6 35B-A3B @UD-IQ3_S [MTP]":
        cmd: |
          ${base}
          ${ctx_l}
          ${mtp}
          --spec-draft-n-max 2
          -hf unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-IQ3_S
      # Official repo has MTP but only Q4+ (21.7G, won't fit); bartowski's
      # build has nextn AND smaller quants. If this OOMs, fall back to Q3_K_S
      # (16.0G instead of 15.3G) or IQ2_M (12.5G).
      "Ornith-1.5 35B-A3B @IQ3_XXS [MTP]":
        cmd: |
          ${base}
          ${ctx_l}
          ${mtp}
          -hf bartowski/Ornith-1.5-35B-A3B-GGUF:IQ3_XXS
