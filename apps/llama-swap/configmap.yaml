apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: llama-swap
data:
  config.yaml: |
    healthCheckTimeout: 500
    logLevel: info
    logTimeFormat: ""
    # "proxy" hid llama-server's stderr, so a model that died on load only
    # surfaced as llama-swap's generic "upstream command exited prematurely".
    logToStdout: "both"
    metricsMaxInMemory: 1000
    captureBuffer: 15
    sendLoadingState: true
    globalTTL: 0
    # Was 10s. Hermes drives these models across multi-step agent turns, so a
    # 10s idle eviction paid a reload on nearly every turn. Only one model can
    # be resident anyway (RAM budget), so this never loads two at once -- it
    # just keeps the current one warm for 5 min after the last request.
    unloadTimeout: 300

    macros:
      # -c lives per-model, not here: KV cache is the #2 GPU consumer and the
      # old shared 65536 made every model pay for 64k of it.
      "base":
        /app/llama-server --host 127.0.0.1 --port ${PORT} -fa on -fit on
      # <=12B class gets 32k, 26B/35B class gets 16k (see ceiling note below).
      "ctx_m": "-c 32768"
      "ctx_l": "-c 16384"
      # Hermes Agent refuses any model reporting under 64K context:
      #   "Model ... has a context window of 32,768 tokens, which is below the
      #    minimum 64,000 required by Hermes Agent."
      # It suggests overriding with model.context_length, but that only moves
      # the failure to a context-overflow error on llama-server when the
      # conversation actually exceeds the real -c -- so Hermes' default model
      # gets a genuinely 64k server instead. Only it needs this.
      "ctx_h": "-c 65536"
      # NOTE (open, not acted on): the first decode after a cold load sometimes
      # fails in the MTP draft rather than in the model:
      #     E init: invalid token[0] = 248320      (garbage, not a real token)
      #     E spec draft: llama_decode[1] returned -1
      #     E srv decode: Invalid input batch.  -> HTTP 500
      # It is a race, not a config fault: llama-swap's health check only probes
      # /health, so the client's first request is the draft's first decode.
      # Observed with 50ms readiness polling -- a 1s poll never reproduces it.
      # Dropping `-fit on` looked like a fix (8/8 clean vs 2/4 failing on MiMo
      # in isolation) but it was never confirmed end-to-end, and `-fit on` is
      # what the models shipped with and are known good on. Left in place.
      # Re-test on cold starts before changing anything here.
      #
      # Needs nextn tensors or an mtp-*.gguf sidecar (auto-downloaded from the
      # same repo on first load). See README for the per-model MTP matrix.
      "mtp": "--spec-type draft-mtp"
      # North has no MTP anywhere on HF; ngram speculation needs no draft
      # weights at all and only pays off on repetitive/structured output.
      "ngram": "--spec-type ngram-mod"
      # mmproj on the CPU. The GPU is an iGPU: its whole aperture is ONE fixed
      # budget, the GTT ceiling of 15663 MiB (15.29 GiB), and it is the binding
      # constraint -- not the 24Gi pod limit, which is nowhere near reached.
      # Note radv over-reports the heap as 16175 MiB, so any tool that sizes
      # against the reported heap rather than the aperture lands ~512 MiB
      # short. Putting mmproj in host RAM costs ~1.1G of system RAM (fine) and
      # buys that much GTT back.
      #
      # NOT an optimisation -- a hard requirement on every model whose repo
      # ships an mmproj (6 of the 9: Gemma 12B/26B, Qwen3.5, Qwen3.6, Ornith
      # both sizes). Without it even a plain TEXT request dies with
      # `E init: invalid token[0] = <beyond vocab>` / `Invalid input batch`,
      # because the projector left in the GPU path resolves to a token id
      # above the vocab the context rejects. Measured at 262144 (Gemma) and
      # 248320 (Qwen3.5); Qwen3.5 returned 500 on every single request until
      # this flag was added, while its MTP side was healthy (draft_n 24,
      # accepted 24). Verified by standing llama-server up outside llama-swap:
      # local -m with no mmproj works, -hf without the flag 500s, -hf with the
      # flag works. Repos with no mmproj (North, MiMo, MiniCPM5-2B) need
      # neither this flag nor the ~1.1G of host RAM it costs.
      "mmproj_host": "--no-mmproj-offload"

    models:
      # --- tiny/fast tier: 2B class, 32k ctx, ~2-3G resident ----------------
      # No MTP for this one (plain llama arch, no nextn tensors, no MTP repo
      # on HF), so ngram stands in for it -- it needs no draft weights, and on
      # a 2B the per-token cost of running it is nil.
      #
      # Q4_K_M is deliberate for this slot: it exists to be the quick one, and
      # on a bandwidth-bound iGPU the quant IS the speed. Q4_K_M moves 1541 MiB
      # of weights per token against Q8_0's 2556 MiB, so the "worse" quant is
      # ~1.6x faster here. bartowski also carries the full ladder if that ever
      # wants trading back for quality.
      #
      # --- the "))))))))" bug is NOT a sampling fault ------------------------
      # Reported as: first reply fine, then it repeats the same character
      # forever and never recovers. That is a WEDGED llama-server process, not
      # a tuning problem. Measured directly -- the same four prompts before and
      # after a clean unload:
      #     wedged:  8/8 degenerate, incl. "What is 17 * 23?"
      #     fresh:   0/4 degenerate
      # A wedged process returns pure parens with finish_reason=length and
      # draft acceptance 100%, for EVERY prompt, and it does not self-heal.
      # Every anti-repetition knob was tested against it and none moved the
      # needle by a single character: --dry-multiplier, --repeat-penalty,
      # --frequency-penalty, --presence-penalty (CLI and request-level, up to
      # 3.0/3.0/3.0), and min_p. They cannot help, because they only suppress
      # a token that is already dominating -- they never un-wedge the process.
      #
      # Recovery is an unload (llama-swap #58):
      #   curl -X POST 'http://127.0.0.1:8080/api/models/unload/\
      # MiniCPM5-2B%20%40Q4_K_M%20%5Bngram%5D'
      # A fresh load is usually clean (16/16 over four reload cycles) but has
      # been seen to come up degenerate immediately -- repeat the unload.
      # `ttl` will NOT save you: it evicts on IDLE, and a wedged model that
      # keeps being retried never goes idle.
      #
      # Suspected trigger: a Vulkan context loss. The log carried 37
      # `ggml_vulkan: device lost` / `ErrorDeviceLost` events, including an
      # uncaught `what(): vk::Queue::submit: ErrorDeviceLost`, and 0 in the
      # 10 minutes after a second llama-server was stopped. Running a SECOND
      # llama-server against this GPU (an out-of-band probe, say) reliably
      # produces them -- only ever have one process on the device.
      #
      # --min-p 0.0 / --temp 1.0 below are OpenBMB's documented Think-mode
      # sampling for this model (docs/deployment/llama_cpp.md), added as
      # upstream guidance rather than as the fix for the above. Measured
      # NEUTRAL here: with and without them, 0/4 degenerate across four
      # unload/reload blocks (16 requests), so they neither help nor hurt
      # the wedge -- kept only because they are what the vendor specifies:
      #     "the default min_p=0.05 can lead to repetitive output ...
      #      potentially discarding the exact tokens needed to break out of a
      #      repetition loop. To prevent this, we set min_p=0.0."
      # OpenBMB specifies temp 1.0 / top-p 0.95 for 2B Think mode; our
      # llama-server defaults are 0.8 / 0.95, so only temp needs setting.
      # --- THE GPU IS NOT THE CAUSE -----------------------------------------
      # The whole workload was re-run with `-ngl 0`: GTT/VRAM flat (1592 ->
      # 1590 MiB, proving the weights never left system RAM) and ZERO
      # device-lost / CS-cancelled / 500s after a log marker. It still broke
      # -- c0t1 -> 02-</param>"/".1,,#<function"+2*&<function*'
      # and c0t2 -> .%-..</param>(.</param>.
      #
      # The harness was ruled out too: rebuilding the conversation with
      # plain, well-formed assistant replies (instead of feeding
      # content+reasoning back in) breaks just as fast, at c0t1/c0t2.
      #
      # So this is backend-independent AND transcript-independent:
      # multi-turn only (40+ single-turn requests, never a wedge), and it
      # emits deep-tail BPE artifacts -- </function>, <param>, <function> --
      # which is what a sampler with no probability floor produces.
      #
      # Prime suspect now: `--min-p 0.0 --temp 1.0`, OpenBMB's Think-mode
      # sampling. min_p 0.0 removes the floor entirely and temp 1.0 is
      # hotter than the 0.8 default, so nothing excludes the tail. The
      # earlier "measured NEUTRAL" note further down was VACUOUS: it
      # recorded 0/4 degenerate both ways, i.e. nothing was failing, so it
      # had no power to tell them apart. Both flags are dropped to test it.
      #
      # Ruled out, do not re-test lightly:
      #   * SPECULATION. Disabling it (`--spec-type none`) did NOT stop the
      #     wedge -- 11 clean requests then the same ")))))))", with
      #     draft=None/None on every request confirming it was genuinely
      #     off. The earlier 100% draft_n_accepted was a CONSEQUENCE: ngram
      #     trivially matches a run of ")" already in context. Left off here
      #     only to hold this test to one variable -- restore `${ngram}`.
      #   * GGML_VK_DISABLE_COOPMAT: a no-op. RADV only exposes
      #     VK_KHR_cooperative_matrix for GFX11/RDNA3+; this is GFX10.5.
      #     Reverted in b2fd867d.
      #   * GGML_VK_MAX_NODES_PER_SUBMIT=1 (kept, see deployment.yaml): the
      #     host kernel genuinely shows 11 `ring comp_*.0 timeout` -> GPU
      #     reset -> `[drm] device wedged` cycles matching llama.cpp
      #     #21724, so the flag stays on its own merits. But every wedge
      #     tested reproduced with ZERO kernel messages and zero
      #     llama-server device-lost, so that mechanism is NOT this bug.
      #   * dry/frequency/presence penalties: genuinely neutral -- byte
      #     identical output from 1.3 to 3.0. They only suppress a token
      #     that is already winning, so they cannot shape the tail.
      #   * min_p/temp: NOT neutral after all -- see above; now under test.
      #   * Memory: GTT 2.68G / VRAM 416M with nothing resident -- no leak.
      #   * Model file intact (1.6G); mesa shader cache archived with no
      #     writes in any test window.
      #
      # The id keeps its [ngram] suffix because the README, unload URLs and
      # client configs all reference it.
      "MiniCPM5-2B @Q4_K_M [ngram]":
        cmd: |
          ${base}
          ${ctx_m}
          --spec-type none
          -ngl 0
          -hf bartowski/MiniCPM5-2B-GGUF:Q4_K_M

      # --- <=12B: fast, 32k ctx, ~7-9G resident ----------------------------
      # ${mmproj_host} is required by the three entries here whose repos ship
      # an mmproj (Gemma, Qwen3.5, Ornith 9B); MiMo ships none, so it skips
      # the flag. See the note on the macro -- text requests fail without it.
      "Gemma4 12B @UD-Q4_K_XL [QAT MTP]":
        cmd: |
          ${base}
          ${ctx_m}
          ${mtp}
          ${mmproj_host}
          -hf unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
      # Hermes' default model (apps/hermes/configmap.yaml, model.default).
      #
      # Speculation is ngram, NOT MTP, and that is deliberate. This id runs
      # `-c 65536` because Hermes rejects anything under 64K, and at 64k the
      # cold-start draft race (see `base`) is near-certain rather than
      # occasional: 5 of 6 requests after a fresh load hit
      # `E init: invalid token[0] = 248320`. It is not self-healing either --
      # once the first decode fails the draft's input buffer is never
      # populated, so EVERY request in that process fails until llama-swap
      # unloads it, and the agent's own 3 retries all land in the same broken
      # process. An unusable agent beats a slightly faster one.
      #
      # ngram has no draft weights and no llama_decode, so there is nothing to
      # race. It still catches the self-similar runs reasoning models produce
      # -- MiniCPM5-2B measured 70/70 accepted at mean length 36.
      # MTP measured 81/106 here; if the race is ever fixed upstream,
      # `${mtp}` + `--spec-draft-n-max 6` is the line to restore.
      # `--jinja` (on this entry's cmd, below) makes llama-server apply the
      # GGUF's own chat template through the Jinja engine. Without it the
      # model never terminates: every direct test returned
      # finish_reason="length" and never "stop", and through Hermes it
      # generated 27,821 then 51,638 tokens for "reply with the single word:
      # pong" -- degenerate repetition, which Hermes itself flagged
      # ("Response dominated by repeated text"). The loop is the model never
      # seeing the terminator its template expects. Scoped to this entry
      # rather than `${base}` deliberately: base is shared with both Gemmas
      # and nothing here should change them.
      #
      # `-np 1` because at 64k with n_slots = 4 this id was killing the
      # Vulkan device outright:
      #     E send_error: task id = 0/3/6, error: decode() failed:
      #     vk::Queue::submit: ErrorDeviceLost
      #     terminate called after throwing an instance of
      #     'vk::DeviceLostError'
      # Three tasks were submitting to the same queue concurrently, and the
      # crash was Qwen3.5-specific -- MiniCPM5-2B kept working off the same
      # device (GTT back to 14 MiB, no reset needed), so this is load, not a
      # wedged driver. One slot removes the concurrency and halves the KV
      # footprint, at the cost of queueing. It also cost throughput when
      # tried earlier (3.81 vs 6.05 tok/s), which is the right trade for
      # the only model Hermes talks to.
      "Qwen3.5 9B @UD-Q4_K_XL [ngram]":
        cmd: |
          ${base}
          ${ctx_h}
          -np 1
          ${ngram}
          ${mmproj_host}
          --jinja
          -hf unsloth/Qwen3.5-9B-MTP-GGUF:UD-Q4_K_XL
      "Ornith-1.5 9B @Q4_K_M [MTP]":
        cmd: |
          ${base}
          ${ctx_m}
          ${mtp}
          ${mmproj_host}
          -hf ornith-ai/Ornith-1.5-9B-GGUF:Q4_K_M
      # VitreousCut ships the MTP sidecar in a separate file (…-Q4_K_M-MTP.gguf),
      # so the quant token must match the sidecar's name too, not just weights.
      "MiMo-V2.6-Distill-9B @Q4_K_M [MTP]":
        cmd: |
          ${base}
          ${ctx_m}
          ${mtp}
          -hf VitreousCut/MiMo-V2.6-Distill-Qwen-9B-MTP-GGUF:Q4_K_M

      # --- 26B/35B: 16k ctx, ~13-14G weights, one at a time ---------------
      # -np 1 on the big models is deliberate and is the main tuning lever for
      # the GTT ceiling: dropping 4 slots -> 1 reclaimed 624 MiB on Gemma 26B
      # (15470 -> 14846 of 15663) and 1016 MiB on North, and it is what makes
      # the Qwen3.6 / North quants below fit at 16k at all.
      # Measured GTT spare of 15663: Gemma 26B 817, Qwen3.6 708,
      # North 1142, Ornith 35B 1512. Anything under ~600 has failed to load.
      "Gemma4 26B-A4B @UD-Q4_K_XL [QAT MTP]":
        cmd: |
          ${base}
          ${ctx_l}
          -np 1
          ${mtp}
          --spec-draft-n-max 4
          ${mmproj_host}
          -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
      # No MTP exists for North (zero nextn tensors, no MTP repo on HF), so
      # ngram speculation stands in for it. Note it measured 0 accepted of
      # ~35 proposed on short prompts -- it is expected to pay off on long,
      # repetitive agent transcripts, not on a 60-token smoke test.
      # UD-Q3_K_M at 16k measured 14521/15663 GTT *with* -np 1; without -np 1
      # the same quant only leaves 126 MiB, and UD-IQ4_NL does not fit at all.
      "North-Mini-Code @UD-Q3_K_M [ngram]":
        cmd: |
          ${base}
          ${ctx_l}
          -np 1
          ${ngram}
          -hf unsloth/North-Mini-Code-1.0-GGUF:UD-Q3_K_M
      # UD-IQ3_S (14635 MiB) OOMs at 16k on its own -- it needs -np 1, which
      # measured 14955/15663 (708 MiB spare). The safe fallback is
      # UD-IQ3_XXS, 1218 MiB smaller, which fits without -np 1.
      "Qwen3.6 35B-A3B @UD-IQ3_S [MTP]":
        cmd: |
          ${base}
          ${ctx_l}
          -np 1
          ${mtp}
          --spec-draft-n-max 2
          ${mmproj_host}
          -hf unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-IQ3_S
      # bartowski's build has nextn AND the small quants the official repo lacks
      # (the official one starts at Q4 = 21.7G). Q2_K_L (12.65G) is the largest
      # that fits: IQ3_XXS above it fails even at -c 8192. Measures 14151/15663.
      "Ornith-1.5 35B-A3B @Q2_K_L [MTP]":
        cmd: |
          ${base}
          ${ctx_l}
          ${mtp}
          ${mmproj_host}
          -hf bartowski/Ornith-1.5-35B-A3B-GGUF:Q2_K_L
