apiVersion: pvcexplorer.io/v1alpha1
kind: PVCExplorerScope
metadata:
  name: homelab
spec:
  namespaces:
    # "Every namespace": the controller registers nothing when both `names` and
    # `labelSelector` are empty, so select on the label every namespace carries.
    labelSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: Exists
  discovery:
    mode: Auto
    # Upstream bug: the agent Deployment/Service are named after the PVC, so if an
    # app's own Deployment shares its PVC's name, the controller overwrites that
    # app's Deployment/Service with agent ones (scaling the app to zero). These
    # five PVCs collide and are therefore excluded until upstream adds a suffix.
    excludePVCs:
      - kube-prometheus-grafana
      - prowlarr
      - radarr
      - sonarr
      - unsloth-studio
  deletionPolicy: Cleanup
  defaults:
    mode: ScaledToZero
    # Pinned: default is :latest; v0.1.0 is the current latest digest.
    image: ghcr.io/pvc-explorer-operator/pvc-explorer-agent:v0.1.0
    forceRW: false
    scaling:
      idleTimeout: 10m
      startupTimeout: 60s
    mountStrategy:
      # local-path volumes are node-bound, so agents must follow the PVC's node.
      allowNodeAffinity: true
      fallbackOnConflict: Pending
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
