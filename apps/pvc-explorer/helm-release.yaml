apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pvc-explorer
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      # Chart is read from this repository's submodule instead of a published repo:
      # upstream has no releases, no Helm repo and no OCI chart (yet).
      chart: ./apps/pvc-explorer/vendor/pvc-explorer/helm/pvc-explorer
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  releaseName: pvc-explorer
  targetNamespace: pvc-explorer-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
  values:
    # The chart runs without --leader-elect, so it must stay at a single replica.
    replicaCount: 1
    image:
      repository: ghcr.io/pvc-explorer-operator/pvc-explorer
      # Chart default "latest" does not exist in GHCR; tag matches the submodule
      # commit (b628071). Only dev* tags exist upstream.
      tag: dev-b628071
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
