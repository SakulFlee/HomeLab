# Upstream's own binding (config/rbac/role_binding.yaml) points at the ServiceAccount
# "controller-manager" in namespace "system", which does not exist here. The Helm chart
# creates "pvc-explorer-controller-manager" in the release namespace instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-explorer-manager-rolebinding
  labels:
    app: pvc-explorer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-explorer-manager-role
subjects:
  - kind: ServiceAccount
    name: pvc-explorer-controller-manager
    namespace: pvc-explorer-system
