apiVersion: v1
kind: Service
metadata:
  name: unsloth-studio
  namespace: unsloth
spec:
  type: ClusterIP
  selector:
    app: unsloth-studio
  ports:
    - name: studio
      port: 8000
      targetPort: studio
---
# Deliberately ClusterIP-only: JupyterLab is a full shell inside the container.
# Reach it with `kubectl -n unsloth port-forward svc/unsloth-jupyter 8888:8888`.
apiVersion: v1
kind: Service
metadata:
  name: unsloth-jupyter
  namespace: unsloth
spec:
  type: ClusterIP
  selector:
    app: unsloth-studio
  ports:
    - name: jupyter
      port: 8888
      targetPort: jupyter
