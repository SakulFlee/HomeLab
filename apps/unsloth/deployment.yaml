apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsloth-studio
  namespace: unsloth
  labels:
    app: unsloth-studio
spec:
  selector:
    matchLabels:
      app: unsloth-studio
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: unsloth-studio
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab
      # --ipc=host from the upstream AMD quickstart; ROCm wants a big shared
      # memory segment for kernel/marshalling traffic.
      hostIPC: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        # --group-add video render from the upstream AMD quickstart.
        # Host gids: video=26, render=303 (NixOS, verified on this node).
        supplementalGroups:
          - 26
          - 303
      volumes:
        - name: dev-kfd
          hostPath:
            path: /dev/kfd
            # Fails scheduling/mounting loudly if ROCm's device node is absent.
            type: CharDevice
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: studio
          persistentVolumeClaim:
            claimName: unsloth-studio
        - name: hf-cache
          persistentVolumeClaim:
            claimName: unsloth-hf-cache
        - name: work
          persistentVolumeClaim:
            claimName: unsloth-work
        - name: triton
          persistentVolumeClaim:
            claimName: unsloth-triton
      containers:
        - name: unsloth
          # Not :latest - that is the base image, whose CMD is just `python`
          # (it exits 0 immediately). :studio is the full image: supervisord as
          # PID 1 running `unsloth studio` on 8000 and JupyterLab on 8888.
          image: unsloth/unsloth-rocm:studio
          imagePullPolicy: IfNotPresent
          env:
            # First-run-only password, so the container does not generate one
            # and self-shutdown after UNSLOTH_STUDIO_BOOTSTRAP_TIMEOUT (1h).
            - name: UNSLOTH_STUDIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unsloth-secrets
                  key: UNSLOTH_STUDIO_PASSWORD
            - name: JUPYTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unsloth-secrets
                  key: JUPYTER_PASSWORD
            - name: UNSLOTH_STUDIO_PORT
              value: "8000"
            - name: JUPYTER_PORT
              value: "8888"
            # Fail loudly if ROCm cannot see the GPU, instead of silently
            # serving inference from CPU. Set to "1" only as a stop-gap.
            - name: UNSLOTH_ALLOW_CPU
              value: "0"
            # gfx1035 (Radeon 680M) is an RDNA2 iGPU. Unsloth's published
            # rocm-gfx103X bundle carries kernels only for gfx1030/1031/1032/1034
            # - their #7624 explicitly omits the gfx1033/1035/1036 iGPUs - so the
            # backend picker reports ROCm as no_prebuilt and silently falls back
            # to a CPU llama.cpp. Claim the gfx1030 sibling so the gfx103X asset
            # is selected, and the HSA override makes its code objects load on
            # this iGPU. That override is the value Unsloth's own startup banner
            # recommends ("RDNA2 cards other than gfx1030: 10.3.0"), and it also
            # stops torch relying on JIT for a wheel not built for gfx1035.
            - name: UNSLOTH_ROCM_GFX_ARCH
              value: "gfx1030"
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "10.3.0"
            # Move the managed llama.cpp root off the container layer.
            # /opt/unsloth-studio/llama.cpp is a link into
            # /opt/unsloth-studio-app/llama.cpp, which lives on the overlay and
            # is wiped whenever the pod is recreated - taking a freshly
            # installed 404 MB ROCm bundle with it and silently reverting to
            # the CPU build the image ships. unsloth-studio-home re-links that
            # path at every start (it even sets a user-made link aside), so the
            # link itself cannot be retargeted; naming a directory on the
            # unsloth-studio PVC is the one form it leaves alone.
            # default_managed_llama_dir() honours the override as the managed
            # install root, and the backend picker stays enabled because
            # _switch_support only blocks a custom path owned by "studio" -
            # this one reports source "environment".
            - name: UNSLOTH_LLAMA_CPP_PATH
              value: "/opt/unsloth-studio/llamacpp"
          ports:
            - name: studio
              containerPort: 8000
            - name: jupyter
              containerPort: 8888
          resources:
            limits:
              # Same GPU admission as Jellyfin / llama-swap, plus the rocm
              # group: only the device plugin can lift the device cgroup
              # restriction on /dev/kfd, hostPath alone yields EPERM.
              devic.es/dri: "1"
              devic.es/rocm: "1"
              # Node has ~30.6Gi total; this is an APU, so model weights live in
              # system RAM. Cap so an oversized model OOMs this pod instead of
              # the node.
              memory: 24Gi
              cpu: "4"
            requests:
              cpu: "1"
              # Deliberately low: the node has ~30.6Gi allocatable and the sum
              # of everyone's requests is already ~26Gi, so a higher request
              # simply fails scheduling ("Insufficient memory"). This is a
              # scheduling footprint only; the 24Gi limit above is the real cap.
              memory: 3Gi
          # Studio takes ~60s to answer (torch warm alone is ~13s), so gate
          # startup for up to 5 minutes before readiness/liveness take over.
          startupProbe:
            tcpSocket:
              port: studio
            periodSeconds: 5
            failureThreshold: 60
          # /api/health needs no authentication; /v1/* needs the API key.
          readinessProbe:
            httpGet:
              path: /api/health
              port: studio
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: studio
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
            - name: studio
              mountPath: /opt/unsloth-studio
            - name: hf-cache
              mountPath: /workspace/.cache/huggingface
            - name: work
              mountPath: /workspace/host
            - name: triton
              mountPath: /workspace/.cache/triton
