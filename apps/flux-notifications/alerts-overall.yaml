---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: overall-alerts
  namespace: flux-system
spec:
  providerRef:
    name: notification-provider-fluxer
  eventSeverity: warning
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: Kustomization
      name: "*"
