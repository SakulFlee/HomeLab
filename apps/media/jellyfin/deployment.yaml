apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 0
      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: jellyfin-cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: nas-movies
          hostPath:
            path: /mnt/nas/Movies
        - name: nas-shows
          hostPath:
            path: /mnt/nas/Shows
        - name: nas-nsfw
          hostPath:
            path: /mnt/nas/NSFW
        - name: nas-personal
          hostPath:
            path: /mnt/nas/personal_folder
        - name: dev-dri
          hostPath:
            path: /dev/dri
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              devic.es/dri: "1"
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8096
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-cache
              mountPath: /cache
            - name: nas-movies
              mountPath: /mnt/nas/Movies
            - name: nas-shows
              mountPath: /mnt/nas/Shows
            - name: nas-nsfw
              mountPath: /mnt/nas/NSFW
            - name: nas-personal
              mountPath: /mnt/nas/personal_folder
            - name: dev-dri
              mountPath: /dev/dri
