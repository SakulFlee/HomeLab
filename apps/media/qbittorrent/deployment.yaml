apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app: qbittorrent
spec:
  selector:
    matchLabels:
      app: qbittorrent
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # Forces Kubernetes to kill faster
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      # Ensures DNS lookups go through the VPN.
      # This should prevent DNS leaks.
      # This is only a placeholder and should replaced by gluetun automatically with the correct DNS server.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.8.0.1  # Placeholder! See above.
      volumes:
        - name: gluetun-shared
          emptyDir:
            medium: Memory
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: qb-downloads
          hostPath:
            path: /mnt/nas/qBittorrent
        - name: nas-movies
          hostPath:
            path: /mnt/nas/Movies
        - name: nas-shows
          hostPath:
            path: /mnt/nas/Shows
        - name: nas-nsfw
          hostPath:
            path: /mnt/nas/NSFW
        - name: qbittorrent-temp
          emptyDir: {}
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: qbittorrent-downloads
      initContainers:
        - name: patch-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              CONF=/config/qBittorrent/config/qBittorrent.conf
              if [ -f "$CONF" ]; then
                # Redirect temp downloads to emptyDir (not backed up by restic)
                sed -i 's|^Session\\TempPath=.*|Session\\TempPath=/downloads/temp|' "$CONF"
                # Remove cross-seed AutoRun hook (handled by Qui now)
                sed -i '/\[AutoRun\]/,/^$/{ s|^enabled=.*|enabled=false|; s|^program=.*|program=|; }' "$CONF"
                # Remove cross-seed tag
                sed -i 's|^Session\\Tags=.*|Session\\Tags=|' "$CONF"
                echo "Config patched: TempPath=/downloads/temp, cross-seed removed"
              fi
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
      containers:
        # --- VPN SIDECAR CONTAINER (GLUETUN) ---
        - name: gluetun
          image: qmcgaw/gluetun:latest
          imagePullPolicy: IfNotPresent
          # Required for changing the network settings for the whole pod (i.e. both containers)
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: pia
            - name: FIREWALL
              value: 'on'
            - name: TZ
              value: Europe/Berlin
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: PORT_FORWARD_ONLY
              value: "true"
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: secret-media-vpn
                  key: PIA_USERNAME
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-media-vpn
                  key: PIA_PASSWORD
            - name: VPN_PORT_FORWARDING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret-media-vpn
                  key: PIA_USERNAME
            - name: VPN_PORT_FORWARDING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-media-vpn
                  key: PIA_PASSWORD
          # Expose qBittorrent ports through the Gluetun firewall
          ports:
            - name: webui
              containerPort: 8080
            - name: torrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: torrent-udp
              containerPort: 6881
              protocol: UDP
          volumeMounts:
            - name: gluetun-shared
              mountPath: /tmp/gluetun
        # --- APPLICATION CONTAINER (QBITTORRENT) ---
        - name: qbittorrent
          image: qbittorrentofficial/qbittorrent-nox:latest
          imagePullPolicy: IfNotPresent
          # Traffic should be routed through gluetun, thus no network stack definition here.          
          # This INCLUDES ports!
          command:
            - /bin/sh
            - -c
            - |
              # Read the forwarded port file if it exists, otherwise default to a fallback
              if [ -s /tmp/gluetun/forwarded_port ]; then
                PORT=$(cat /tmp/gluetun/forwarded_port | tr -d '\r\n ')
              else
                PORT=6881 # Default fallback port
              fi

              # Remove lockfile if somehow left over
              rm -f /config/qBittorrent/config/lockfile
              
              echo "Launching qBittorrent with active port: $PORT"
              exec qbittorrent-nox --confirm-legal-notice --torrenting-port=$PORT --profile="/config"
          volumeMounts:
            - name: gluetun-shared
              mountPath: /tmp/gluetun
            - name: qbittorrent-config
              mountPath: /config
            - name: qb-downloads
              mountPath: /mnt/nas/qBittorrent
            - name: nas-movies
              mountPath: /mnt/nas/Movies
            - name: nas-shows
              mountPath: /mnt/nas/Shows
            - name: nas-nsfw
              mountPath: /mnt/nas/NSFW
            - name: qbittorrent-temp
              mountPath: /downloads/temp
            - name: qbittorrent-downloads
              mountPath: /downloads
          # If Gluetun changes the port later, this probe fails, forcing K8s to 
          # restart ONLY this container.
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 1
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  if [ -f /tmp/gluetun/force_restart ]; then
                    echo "Poison Pill found! Removing flag and triggering container restart."
                    rm -f /tmp/gluetun/force_restart
                    exit 1
                  fi

                  STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" http://127.0.0.1:8080)
                  if [ $STATUS_CODE -ne 200 ]; then
                    echo "Health check failed ... killing!"
                    exit 2
                  fi
        - name: port-syncer
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              LAST_PORT=""

              echo "Port Syncer Sidecar Active."
              
              while true; do
                if [ -s /tmp/gluetun/forwarded_port ]; then
                  CURRENT_PORT=$(cat /tmp/gluetun/forwarded_port | tr -d '\r\n ')
                  
                  if [ "$CURRENT_PORT" != "0" ] && [ "$CURRENT_PORT" != "$LAST_PORT" ] && [ ! -z "$CURRENT_PORT" ]; then
                    echo "Gluetun port changed from '$LAST_PORT' to '$CURRENT_PORT'."
                    
                    # Drop the poison pill
                    echo "Creating restart flag file for qBittorrent container..."
                    touch /tmp/gluetun/force_restart

                    LAST_PORT="$CURRENT_PORT"
                  fi
                fi
                sleep 10
              done          
          volumeMounts:
            - name: gluetun-shared
              mountPath: /tmp/gluetun
