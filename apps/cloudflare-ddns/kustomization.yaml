apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
resources:
  - namespace.yaml
  - cronjob.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: cloudflare-ddns-script
    files:
      - ddns.py=ddns.py