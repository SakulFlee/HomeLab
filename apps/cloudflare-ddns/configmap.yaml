apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-ddns-script
  namespace: cloudflare-ddns
data:
  ddns.py: |
    import json
    import os
    import sys
    import urllib.request

    SECRETS = "/var/run/secrets/cloudflare-ddns"
    API_TOKEN = open(f"{SECRETS}/api-token").read().strip()
    ZONE_ID = open(f"{SECRETS}/zone-id").read().strip()
    DOMAINS = open(f"{SECRETS}/domains").read().split()

    CF_API = "https://api.cloudflare.com/client/v4"
    HEADERS = {
        "Authorization": f"Bearer {API_TOKEN}",
        "Content-Type": "application/json",
    }

    # Hosts that are only reachable on the LAN or through the WireGuard
    # VPN. They resolve to the cluster host (192.168.178.200), which is
    # only routable from inside the LAN or via the tunnel. VPN-only
    # services are further restricted by the wireguard-vpn-only Traefik
    # middleware (100.64.0.0/10); the VPN admin UI additionally allows
    # LAN sources through the wireguard-lan-or-vpn middleware.
    PRIVATE_RECORDS = {
        "jellyfin.sakul-flee.de": "192.168.178.200",
        "sonarr.sakul-flee.de": "192.168.178.200",
        "radarr.sakul-flee.de": "192.168.178.200",
        "prowlarr.sakul-flee.de": "192.168.178.200",
        "qbittorrent.sakul-flee.de": "192.168.178.200",
        "qui.sakul-flee.de": "192.168.178.200",
        "bitmagnet.sakul-flee.de": "192.168.178.200",
        "llama-swap.sakul-flee.de": "192.168.178.200",
        "grafana.sakul-flee.de": "192.168.178.200",
        "paperless.sakul-flee.de": "192.168.178.200",
        "syncthing.sakul-flee.de": "192.168.178.200",
        "nas.sakul-flee.de": "192.168.178.200",
        "vpn.sakul-flee.de": "192.168.178.200",
    }


    def http_json(url, method="GET", payload=None):
        data = json.dumps(payload).encode() if payload else None
        req = urllib.request.Request(url, data=data, headers=HEADERS, method=method)
        with urllib.request.urlopen(req, timeout=15) as resp:
            return json.loads(resp.read())


    def current_ip(url):
        with urllib.request.urlopen(url, timeout=15) as resp:
            return resp.read().decode().strip()


    def get_records(name):
        return http_json(f"{CF_API}/zones/{ZONE_ID}/dns_records?name={name}").get("result", [])


    def upsert_a(domain, content):
        existing = [r for r in get_records(domain) if r.get("type") == "A"]
        if existing:
            record = existing[0]
            if record.get("content") == content:
                print(f"{domain} (A) already set to {content}")
                return
            http_json(
                f"{CF_API}/zones/{ZONE_ID}/dns_records/{record['id']}",
                method="PATCH",
                payload={
                    "type": "A",
                    "name": domain,
                    "content": content,
                    "ttl": 120,
                },
            )
            print(f"{domain} (A): {record['content']} -> {content}")
        else:
            # Remove any conflicting non-A record (e.g. a CNAME) for this name
            # before creating the A record.
            for record in get_records(domain):
                http_json(
                    f"{CF_API}/zones/{ZONE_ID}/dns_records/{record['id']}",
                    method="DELETE",
                )
                print(f"{domain}: deleted conflicting {record['type']} record")
            http_json(
                f"{CF_API}/zones/{ZONE_ID}/dns_records",
                method="POST",
                payload={
                    "type": "A",
                    "name": domain,
                    "content": content,
                    "ttl": 120,
                },
            )
            print(f"{domain} (A): created -> {content}")


    ip4 = current_ip("https://ipv4.icanhazip.com")
    for domain in DOMAINS:
        upsert_a(domain, ip4)

    for domain, ip in PRIVATE_RECORDS.items():
        upsert_a(domain, ip)