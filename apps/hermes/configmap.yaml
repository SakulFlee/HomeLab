# Managed scope for Hermes: this file is mounted read-only at
# /etc/hermes/config.yaml, where it wins over ~/.hermes/config.yaml,
# ~/.hermes/.env and the shell environment - but only for the keys it pins,
# and merging is leaf-by-leaf.
#
# `model.default` IS pinned here (Ollama backend): the old stored default was
# a llama-swap model id (`Qwen3.5 9B @UD-Q4_K_XL [ngram]`), which does not exist
# in Ollama's tag namespace. Change it from the dashboard if you want a
# different model - managed scope wins, so that edit won't stick while this key
# is pinned here.
#
# Backend is Ollama (ROCm), one model resident at a time. This is the
# in-cluster Service, not the ingress: the split-DNS answer for
# *.sakul-flee.de only exists for VPN clients, so an external URL would work
# from a laptop and fail from inside the pod.
#
# Bump the ConfigMap name on any edit to this file. ConfigMap edits alone do
# not restart the pod, but a changed name does - that is why this is v7 and
# not v6. (v6 was the Spark-X2.5-4B repoint via a derived :64k tag; v5 was the
# Ollama repoint; v4 was llama-swap; before that Unsloth Studio at
# `http://unsloth-studio.unsloth.svc:8000/v1`. All the earlier backends are
# gone.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-managed-config-v7
  namespace: hermes
data:
  config.yaml: |
    model:
      provider: custom
      # Ollama takes no auth on its OpenAI-compatible endpoint, so there is no
      # key to expand from secrets.
      base_url: http://ollama.ollama.svc:11434/v1
      api_mode: chat_completions
      api_key: ""
      # An Ollama TAG, not a llama-swap model id. The list is
      #   kubectl exec -n ollama deploy/ollama -- ollama list
      # or Admin Panel -> Models in Open-WebUI.
      #
      # Plain `:latest`. There used to be a derived `:64k` tag carrying
      # PARAMETER num_ctx 65536; it was redundant and has been deleted. See
      # `context_length` below for why it was never needed.
      #
      # This is the only model in the store. Two others were imported,
      # tested and removed:
      #   minicpm-v4.6         qwen35, hybrid SSM. Degenerate on ROCm --
      #                        emits one token forever. Clean on CPU, so it
      #                        is the ROCm kernel path, not the weights.
      #   north-mini-code-1.0  18GB, exceeds the ollama container's 16Gi
      #                        limit at any context.
      # Neither is fixable from this repo. Do not re-import either without
      # reading the "Hybrid SSM models are broken on this ROCm build"
      # section of apps/ollama/README.md first.
      default: "SparkLLM/Spark-X2.5-4B:latest"
      # THIS IS THE LOAD-BEARING SETTING. Do not remove it.
      #
      # It is not a declaration of intent that something else has to honour
      # -- it is the number Hermes sends. The mechanism, in Hermes' own code:
      #
      #   1. `model.ollama_num_ctx` is unset, so Hermes probes the server's
      #      /api/show for the model's window.
      #   2. That probe prefers `parameters.num_ctx` (the RUNTIME window)
      #      and falls back to `model_info.*.context_length` (the GGUF
      #      TRAINING max). This model advertises 1048576, and with no
      #      PARAMETER set that is what comes back.
      #   3. `_configure_ollama_num_ctx` then CAPS the detected value to
      #      this key, logging "Ollama num_ctx capped: 1048576 -> 65536".
      #   4. Every request carries `options: {num_ctx: 65536}`, added by
      #      the `custom` provider's build_api_kwargs_extras. Ollama honours
      #      a per-request num_ctx, so the server allocates 65536.
      #
      # So the 64K floor is met by the request, not by how the model was
      # imported. Two consequences worth knowing:
      #   - OLLAMA_CONTEXT_LENGTH on the ollama deployment is irrelevant
      #     here; Hermes overrides it per request. It is set for Open WebUI.
      #   - Do not "fix" this by importing the model with a num_ctx
      #     parameter or by creating a derived tag. Both are redundant, and
      #     a derived tag additionally lives only in the volatile model
      #     store, where a PVC delete would silently break this line.
      #
      # Hermes refuses to start against a window below 64K:
      #   "... has a context window of 32,768 tokens, which is below the
      #    minimum 64,000 required by Hermes Agent"
      # It does not learn the window from /v1/models, which omits
      # max_model_len exactly as llama-swap's did -- hence this key.
      context_length: 65536

    terminal:
      backend: local
      cwd: /workspace

    approvals:
      mode: smart

    compression:
      enabled: true
      threshold: 0.85

    dashboard:
      public_url: https://hermes-dashboard.sakul-flee.de
      # Traefik runs with hostNetwork, so the proxy is the node itself /
      # the pod CIDR rather than a bridge address. Bounded CIDRs only -
      # Hermes rejects *, 0.0.0.0/0 and ::/0.
      trusted_proxies:
        - 192.168.178.0/24
        - 10.42.0.0/16
