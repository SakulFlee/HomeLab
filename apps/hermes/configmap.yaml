# Managed scope for Hermes: this file is mounted read-only at
# /etc/hermes/config.yaml, where it wins over ~/.hermes/config.yaml,
# ~/.hermes/.env and the shell environment - but only for the keys it pins,
# and merging is leaf-by-leaf.
#
# `model.default` IS pinned here (llama-swap backend): the old stored default
# (`unsloth/North-Mini-Code-1.0-GGUF:UD-IQ4_NL`) pointed at Unsloth and would
# 404 against llama-swap's model list. Change it from the dashboard if you
# want a different model - managed scope wins, so that edit won't stick while
# this key is pinned here.
#
# Backend is llama-swap (local llama.cpp, one model resident at a time).
# Unsloth Studio is scaled to 0; to go back, swap this `model:` block for
# `base_url: http://unsloth-studio.unsloth.svc:8000/v1` +
# `api_key: "${UNSLOTH_API_KEY}"` (re-encrypt apps/hermes/secrets if the key
# is gone) and bump the ConfigMap name - ConfigMap edits alone do not restart
# the pod, but a changed name does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-managed-config-v2
  namespace: hermes
data:
  config.yaml: |
    model:
      provider: custom
      # llama-swap takes no auth (it sits behind the same LAN/VPN reachability
      # as everything else here), so there is no key to expand from secrets.
      base_url: http://llama-swap.llama-swap.svc:8080/v1
      api_mode: chat_completions
      api_key: ""
      # llama-swap id, not an HF path - the full list is at
      # `curl http://llama-swap.llama-swap.svc:8080/v1/models` or see
      # apps/llama-swap/README.md. 9B + native MTP: fast turns, ~8G resident.
      default: "Qwen3.5 9B @UD-Q4_K_XL [MTP]"

    terminal:
      backend: local
      cwd: /workspace

    approvals:
      mode: smart

    compression:
      enabled: true
      threshold: 0.85

    dashboard:
      public_url: https://hermes-dashboard.sakul-flee.de
      # Traefik runs with hostNetwork, so the proxy is the node itself /
      # the pod CIDR rather than a bridge address. Bounded CIDRs only -
      # Hermes rejects *, 0.0.0.0/0 and ::/0.
      trusted_proxies:
        - 192.168.178.0/24
        - 10.42.0.0/16
