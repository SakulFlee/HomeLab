# Backs up ONLY the local-path-backup tier (the "backup" volume), matching
# nixos/hosts/homelab/common/backup.nix: repo=/var/lib/backups/repo, source=
# /var/lib/rancher/k3s/storage/backup. Databases dump themselves into that
# tier via app-level dumps (CNPG recurringBackups, paperless pg-dump), so the
# backup tier is where consistency lives — we do NOT snapshot local-path-persistent here.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: homelab-restic
  namespace: kube-system
  labels:
    app.kubernetes.io/name: homelab-restic
spec:
  # Single-node today = 1 replica. Future-proof: adds one pod per node, each
  # backing up its own node's backup tier into a shared repo (per-node repos
  # avoid restic lock contention once multi-node).
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-restic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-restic
    spec:
      hostPID: false
      # root: read a node-local hostPath and write the repo on NVMe.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: restic
          image: ghcr.io/restic/restic:0.16.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              BACKUP_TIER="/var/lib/rancher/k3s/storage/backup"
              REPO="/var/lib/backups/repo"

              while true; do
                if [ -d "$BACKUP_TIER" ]; then
                  # NOT --remove-all. This repository has a second writer: the
                  # host's restic-backup.service (backup.nix) backs up the Incus
                  # pools into the same repo, and that file goes to some length to
                  # serialise itself -- flock, plus --retry-lock on its backup.
                  # `--remove-all` deletes every lock in the repository including
                  # ones held by a process that is running RIGHT NOW, so it
                  # cancelled that mutual exclusion once an hour. The comment
                  # here used to claim it cleared "stale locks from dead pods",
                  # which is what plain `unlock` does and what --remove-all
                  # emphatically does not.
                  #
                  # The failure that produced: `restic prune` is not safe to run
                  # twice at once, and with the lock removed the two schedules
                  # could overlap. Once they had, this repository's index began
                  # referencing pack files that were no longer there --
                  #
                  #   The index references 16 needed pack files which are missing
                  #   Fatal: packs from index missing in repo
                  #
                  # and every host-side run since has failed at forget/prune.
                  # Plain unlock still clears our own dead pod's lock; restic
                  # ignores a lock older than 30 minutes on its own, so nothing
                  # here needs to reach across and delete someone else's.
                  restic unlock -r "$REPO" --password-file /etc/restic/pw || true

                  restic backup \
                    -r "$REPO" \
                    --password-file /etc/restic/pw \
                    "$BACKUP_TIER" \
                    --tag k8s \
                    --exclude-caches || echo "backup failed, will retry next hour"

                  # --tag k8s --group-by tags, to mirror backup.nix exactly.
                  # Untagged, this policy applies to every snapshot group in a
                  # repository the host also writes to, and backup.nix's own
                  # comment says the scoping exists precisely so the two
                  # schedules cannot delete each other's history. It only
                  # happens to be harmless today because restic's default
                  # grouping is host,paths and this pod's hostname and paths
                  # differ from the host's -- an accident, not a guarantee.
                  restic forget \
                    -r "$REPO" \
                    --password-file /etc/restic/pw \
                    --tag k8s \
                    --group-by tags \
                    --keep-hourly 24 \
                    --keep-daily 7 \
                    --keep-monthly 3 \
                    --prune || echo "forget/prune failed, will retry next hour"
                else
                  echo "$BACKUP_TIER does not exist, skipping"
                fi

                # Sleep 1 hour + random 0-5m jitter
                sleep $(( 3600 + RANDOM % 300 ))
              done
          volumeMounts:
            # Source: ONLY the backup tier (not persistent). Read-only.
            - name: backup-tier
              mountPath: /var/lib/rancher/k3s/storage/backup
              readOnly: true
            # Repo target: reuse Syncthing's watched dir so off-box replication is free.
            - name: repo-root
              mountPath: /var/lib/backups
            # Password file (matches the NixOS unit's --password-file path).
            - name: pw
              mountPath: /etc/restic/pw
              subPath: pw
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: backup-tier
          hostPath:
            path: /var/lib/rancher/k3s/storage/backup
            type: Directory
        - name: repo-root
          hostPath:
            path: /var/lib/backups
            type: Directory
        - name: pw
          secret:
            secretName: homelab-restic-password
            items:
              - key: pw
                path: pw
