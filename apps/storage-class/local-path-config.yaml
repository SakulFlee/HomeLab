apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": [
            "/var/lib/rancher/k3s/storage",
            "/var/lib/rancher/k3s/storage/persistent",
            "/var/lib/rancher/k3s/storage/volatile"
          ]
        }
      ]
    }
