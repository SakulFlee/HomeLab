apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-dns-reconciler
  namespace: headscale
data:
  reconciler.py: |
    import json
    import os
    import sys
    import urllib.request

    API_KEY = open("/var/run/secrets/headscale-reconciler/api-key").read().strip()
    API_URL = "http://headscale.headscale.svc.cluster.local:8080/api/v1/node"
    RECORDS_PATH = "/var/lib/headscale/extra-records.json"

    SERVICES = [
        "jellyfin.sakul-flee.de",
        "sonarr.sakul-flee.de",
        "radarr.sakul-flee.de",
        "prowlarr.sakul-flee.de",
        "qbittorrent.sakul-flee.de",
        "qui.sakul-flee.de",
        "bitmagnet.sakul-flee.de",
        "llama-swap.sakul-flee.de",
        "open-webui.sakul-flee.de",
        "grafana.sakul-flee.de",
        "paperless.sakul-flee.de",
        "syncthing.sakul-flee.de",
        "headplane.sakul-flee.de",
        "nas.sakul-flee.de",
    ]

    req = urllib.request.Request(API_URL, headers={"Authorization": f"Bearer {API_KEY}"})
    with urllib.request.urlopen(req, timeout=10) as resp:
        data = json.loads(resp.read())

    router_ip = None
    for node in data.get("nodes", []):
        if node.get("name") == "homelab-router":
            for ip in node.get("ipAddresses", []):
                if ip.startswith("100."):
                    router_ip = ip
                    break
            break

    if not router_ip:
        print("ERROR: could not find homelab-router node", file=sys.stderr)
        sys.exit(1)

    records = [{"name": svc, "type": "A", "value": router_ip} for svc in SERVICES]
    new_content = json.dumps(records, indent=2) + "\n"

    try:
        with open(RECORDS_PATH) as f:
            current = f.read()
    except FileNotFoundError:
        current = ""

    if current != new_content:
        with open(RECORDS_PATH, "w") as f:
            f.write(new_content)
        print(f"Updated extra-records.json -> {router_ip}")
    else:
        print("No change (router IP still " + router_ip + ")")