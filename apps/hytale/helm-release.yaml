apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hytale
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
spec:
  interval: 15m
  timeout: 30m
  chart:
    spec:
      chart: hytale
      version: ">=1.1.0"
      sourceRef:
        kind: HelmRepository
        name: hytale
  releaseName: hytale
  targetNamespace: hytale
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    image:
      repository: forgejo.sakul-flee.de/containers/hytale
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
      runAsNonRoot: false
    resources:
      limits:
        cpu: 2000m
        memory: 8Gi
      requests:
        cpu: 250m
        memory: 2Gi
    persistence:
      size: 32Gi
      existingClaim: "hytale-hytale-0"
    mods:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: hytale
            patch: |
              - op: remove
                path: /spec/template/spec/containers/0/volumeMounts/2/subPath
