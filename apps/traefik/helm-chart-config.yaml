apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    hostNetwork: true
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        # hostNetwork + hostPorts: a new pod can't schedule while the old
        # one holds the ports, so let the old pod terminate first.
        maxUnavailable: 1
        maxSurge: 0
    podSecurityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - NET_BIND_SERVICE
        drop:
          - ALL
      readOnlyRootFilesystem: true
    service:
      enabled: false
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    logs:
      access:
        enabled: true
        fields:
          headers:
            defaultmode: keep
    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
      matrix-federation:
        port: 8448
        expose:
          default: true
        exposedPort: 8448
        protocol: TCP
      minecraft:
        port: 25565
        expose:
          default: true
        exposedPort: 25565
        protocol: TCP