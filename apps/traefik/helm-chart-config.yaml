apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    hostNetwork: true
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - NET_BIND_SERVICE
        drop:
          - ALL
      readOnlyRootFilesystem: true
    service:
      enabled: false
    logs:
      access:
        enabled: true
        fields:
          headers:
            defaultmode: keep
    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
      matrix-federation:
        port: 8448
        expose:
          default: true
        exposedPort: 8448
        protocol: TCP