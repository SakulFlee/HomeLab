---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: fluxer
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
    - name: tcp
      port: 7881
      targetPort: 7881
    - name: udp
      port: 7882
      targetPort: 7882
      protocol: UDP
