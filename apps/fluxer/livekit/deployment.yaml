---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: fluxer
  labels:
    app: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      enableServiceLinks: false
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.12.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/livekit.yaml"]
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: fluxer-config
                  key: FLUXER_LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: fluxer-secrets
                  key: LIVEKIT_API_SECRET
            - name: LIVEKIT_KEYS
              value: "fluxer: $(LIVEKIT_API_SECRET)"
          ports:
            - name: http
              containerPort: 7880
            - name: tcp
              containerPort: 7881
            - name: udp
              containerPort: 7882
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
      volumes:
        - name: config
          configMap:
            name: livekit-config
