apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluxer-pg-dumps
  namespace: fluxer
spec:
  accessModes:
    - ReadWriteOnce
  # Restic only backs up the "backup" tier (see
  # apps/storage-class/restic-daemonset.yaml), so the dump has to land there to
  # be captured off-box. The Postgres data directory itself deliberately stays
  # on "persistent" and is never file-backed-up -- a live PGDATA copy is torn,
  # this dump is the authoritative artifact.
  storageClassName: local-path-backup
  resources:
    requests:
      storage: 5Gi