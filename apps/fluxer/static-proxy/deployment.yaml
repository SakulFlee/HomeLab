---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-proxy
  namespace: fluxer
  labels:
    app: static-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: static-proxy
  template:
    metadata:
      labels:
        app: static-proxy
    spec:
      containers:
        - name: static-proxy
          image: ghcr.io/fluxerapp/fluxer-static:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
