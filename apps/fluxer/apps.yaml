          envFrom:
            - configMapRef:
                name: fluxer-config
            - secretRef:
                name: fluxer-secrets
          env:
            - name: FLUXER_APP_PROXY_HOST
              value: 0.0.0.0
            - name: FLUXER_APP_PROXY_PORT
              value: "8080"
            - name: DISCOVERY_UPSTREAM_URL
              value: http://api:8080/.well-known/fluxer
