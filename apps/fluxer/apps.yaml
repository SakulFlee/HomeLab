---
# ---------------------------------------------------------------------------
# api
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fluxer
  labels:
    app: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: init-buckets
          image: chrislusf/seaweedfs:4.34
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -s -o /dev/null "http://seaweedfs:8333/"; do sleep 2; done
              for b in fluxer fluxer-uploads fluxer-downloads fluxer-reports fluxer-harvests; do
                curl -s -o /dev/null -X PUT "http://seaweedfs:8333/$b" || true
              done
              exit 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: api
          image: ghcr.io/fluxerapp/fluxer-api:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fluxer-config
            - secretRef:
                name: fluxer-secrets
          env:
            - name: FLUXER_API_PORT
              value: "8080"
            - name: FLUXER_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fluxer
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# ---------------------------------------------------------------------------
# worker
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fluxer
  labels:
    app: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/fluxerapp/fluxer-api:v1
          imagePullPolicy: IfNotPresent
          workingDir: /usr/src/app/fluxer_api
          command: ["./node_modules/.bin/tsx", "src/WorkerEntrypoint.ts"]
          envFrom:
            - configMapRef:
                name: fluxer-config
            - secretRef:
                name: fluxer-secrets
          env:
            - name: FLUXER_API_WORKER_MODE
              value: all_lanes
            - name: FLUXER_API_WORKER_ENABLE_CRON_SCHEDULER
              value: "true"
            - name: FLUXER_API_WORKER_ENABLE_VOICE_RECONCILIATION
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
---
# ---------------------------------------------------------------------------
# gateway (Erlang WebSocket)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fluxer
  labels:
    app: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/fluxerapp/fluxer-gateway:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fluxer-config
            - secretRef:
                name: fluxer-secrets
          env:
            - name: FLUXER_GATEWAY_PORT
              value: "8080"
            - name: FLUXER_GATEWAY_MEDIA_PROXY_ENDPOINT
              value: https://fluxer.sakul-flee.de/media
            - name: FLUXER_GATEWAY_STATIC_CDN_ENDPOINT
              value: https://fluxer.sakul-flee.de
            - name: FLUXER_GATEWAY_LOGGER_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fluxer
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
