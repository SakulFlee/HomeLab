  name: app-proxy
  namespace: fluxer
  labels:
    app: app-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-proxy
  template:
    metadata:
      labels:
        app: app-proxy
    spec:
      containers:
        - name: app-proxy
          image: ghcr.io/fluxerapp/fluxer-app-proxy-self-hosted:v1
