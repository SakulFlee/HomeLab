---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: fluxer
data:
  livekit.yaml: |
    port: 7880
    log_level: info
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: true
      stun_servers:
        - stun.l.google.com:19302
        - stun1.l.google.com:19302
    webhook:
      api_key: fluxer
      urls:
        - http://api:8080/webhooks/livekit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: fluxer
  labels:
    app: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.12.0
          imagePullPolicy: IfNotPresent
          command: ["--config", "/etc/livekit.yaml"]
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: fluxer-config
                  key: FLUXER_LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: fluxer-secrets
                  key: LIVEKIT_API_SECRET
            - name: LIVEKIT_KEYS
              value: "fluxer:$(LIVEKIT_API_SECRET)"
          ports:
            - name: http
              containerPort: 7880
            - name: tcp
              containerPort: 7881
            - name: udp
              containerPort: 7882
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: fluxer
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
    - name: tcp
      port: 7881
      targetPort: 7881
    - name: udp
      port: 7882
      targetPort: 7882
      protocol: UDP
