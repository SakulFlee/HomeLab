---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fluxer-sakul-flee-de-tls
  namespace: fluxer
spec:
  secretName: fluxer-sakul-flee-de-tls
  dnsNames:
    - fluxer.sakul-flee.de
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: fluxer
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-gateway
  namespace: fluxer
spec:
  stripPrefix:
    prefixes:
      - /gateway
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-media
  namespace: fluxer
spec:
  stripPrefix:
    prefixes:
      - /media
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-livekit
  namespace: fluxer
spec:
  stripPrefix:
    prefixes:
      - /livekit
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-admin
  namespace: fluxer
spec:
  stripPrefix:
    prefixes:
      - /admin
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fluxer
  namespace: fluxer
spec:
  entryPoints:
    - websecure
  tls:
    secretName: fluxer-sakul-flee-de-tls
  routes:
    - match: Host(`fluxer.sakul-flee.de`) && PathPrefix(`/api`)
      priority: 30
      kind: Rule
      middlewares:
        - name: strip-api
          namespace: fluxer
      services:
        - name: api
          port: 8080
    - match: Host(`fluxer.sakul-flee.de`) && PathPrefix(`/gateway`)
      priority: 30
      kind: Rule
      middlewares:
        - name: strip-gateway
          namespace: fluxer
      services:
        - name: gateway
          port: 8080
    - match: Host(`fluxer.sakul-flee.de`) && PathPrefix(`/media`)
      priority: 30
      kind: Rule
      middlewares:
        - name: strip-media
          namespace: fluxer
      services:
        - name: media-proxy
          port: 8080
    - match: Host(`fluxer.sakul-flee.de`) && PathPrefix(`/livekit`)
      priority: 30
      kind: Rule
      middlewares:
        - name: strip-livekit
          namespace: fluxer
      services:
        - name: livekit
          port: 7880
    - match: Host(`fluxer.sakul-flee.de`) && PathPrefix(`/admin`)
      priority: 30
      kind: Rule
      middlewares:
        - name: strip-admin
          namespace: fluxer
      services:
        - name: admin
          port: 8080
    - match: Host(`fluxer.sakul-flee.de`) && (PathPrefix(`/web`) || PathPrefix(`/emoji`) || PathPrefix(`/libs`) || PathPrefix(`/avatars`) || PathPrefix(`/badges`) || PathPrefix(`/desktop`) || PathPrefix(`/embeds`))
      priority: 40
      kind: Rule
      services:
        - name: static-proxy
          port: 8080
    - match: Host(`fluxer.sakul-flee.de`) && PathPrefix(`/.well-known/fluxer`)
      priority: 35
      kind: Rule
      services:
        - name: api
          port: 8080
    - match: Host(`fluxer.sakul-flee.de`) && PathPrefix(`/`)
      priority: 10
      kind: Rule
      services:
        - name: app-proxy
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: fluxer-livekit-tcp
  namespace: fluxer
spec:
  entryPoints:
    - livekit-tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: livekit
          port: 7881
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: fluxer-livekit-udp
  namespace: fluxer
spec:
  entryPoints:
    - livekit-udp
  routes:
    - services:
        - name: livekit
          port: 7882
