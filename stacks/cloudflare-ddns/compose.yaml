name: cloudflare-ddns

services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns
    restart: unless-stopped
    # Host networking is required by IP6_PROVIDER=local: inside a bridge
    # network the container only sees its own addresses, not the host's.
    network_mode: host
    env_file:
      - path: /run/homelab/secrets/cloudflare-ddns.env
        required: false
    environment:
      # DOMAINS manages both A and AAAA. Only the apex gets an AAAA for now:
      # the host has a public IPv6 and a router pinhole for 443, but no
      # pinhole has been verified for the WireGuard UDP port, so wg. stays
      # IPv4-only to keep client configs working. home. is Home Assistant,
      # paperless. is the document stack and hermes. is the agent webapp; all
      # are DNS-only like the other admin names so Caddy's vpn_only gate sees
      # the real client address instead of a Cloudflare edge.
      DOMAINS: "sakul-flee.de"
      IP4_DOMAINS: "wg.sakul-flee.de,home.sakul-flee.de,chamber.sakul-flee.de,paperless.sakul-flee.de,hermes.sakul-flee.de"
      PROXIED: "false"
      # 'local' reads the address that would be used to reach Cloudflare.
      # Temporary privacy addresses are disabled in /etc/sysctl.d so this is
      # the stable, MAC-derived address.
      IP6_PROVIDER: "local"
      TTL: "120"
