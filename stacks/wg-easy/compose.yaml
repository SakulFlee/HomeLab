name: wg-easy

services:
  wg-easy:
    # v15 is a rewrite with a different configuration model (setup wizard,
    # wg0.json import, most env vars moved into the UI). This stack is written
    # for the v14 configuration, so stay on 14 until that migration is planned.
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # ip_forward and src_valid_mark are host sysctls (see
    # /etc/sysctl.d/90-homelab.conf). Docker refuses to set sysctls in the
    # host network namespace, so they cannot live here.
    env_file:
      - path: /run/homelab/secrets/wg-easy.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "51821"
      # vpn.sakul-flee.de is the Cloudflare-proxied UI name; WireGuard is UDP
      # and cannot traverse the proxy. wg.sakul-flee.de is DNS-only and is the
      # record cloudflare-ddns keeps pointing at the WAN address.
      WG_HOST: wg.sakul-flee.de
      WG_PORT: "51820"
      WG_DEFAULT_ADDRESS: 100.64.0.x
      WG_DEFAULT_DNS: 192.168.178.200
      # IPv4 only on purpose: wg0 has no IPv6 address, IPv6 forwarding is off
      # and there is no NAT66. Advertising ::/0 sends all IPv6 into a tunnel
      # that cannot carry it, which blackholes every dual-stack destination.
      WG_ALLOWED_IPS: 0.0.0.0/0
      WG_PERSISTENT_KEEPALIVE: "25"
      WG_MTU: "1420"
      # Full-tunnel NAT. The host NIC is eno1 on the current hardware.
      WG_POST_UP: >-
        iptables -t nat -A POSTROUTING -s 100.64.0.0/24 -o eno1 -j MASQUERADE;
        iptables -A FORWARD -i wg0 -j ACCEPT;
        iptables -A FORWARD -o wg0 -j ACCEPT
      WG_POST_DOWN: >-
        iptables -t nat -D POSTROUTING -s 100.64.0.0/24 -o eno1 -j MASQUERADE;
        iptables -D FORWARD -i wg0 -j ACCEPT;
        iptables -D FORWARD -o wg0 -j ACCEPT
    volumes:
      - /srv/docker/wg-easy:/etc/wireguard
