name: wg-easy

services:
  wg-easy:
    # v15 is a rewrite: configuration lives in the UI/database instead of env
    # vars, and it supports IPv6 in the tunnel. INIT_* performs the first-time
    # setup without a wizard and is ignored on every later start.
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Docker refuses sysctls in the host network namespace, so ip_forward,
    # src_valid_mark and IPv6 forwarding live in /etc/sysctl.d/90-homelab.conf.
    env_file:
      - path: /run/homelab/secrets/wg-easy.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "51821"
      # The UI is reached through Caddy, which is the only client we trust to
      # supply X-Forwarded-* metadata.
      TRUSTED_PROXIES: "172.16.0.0/12"

      # First-start setup. Group 1 (username/password/host/port) comes from the
      # rendered env file; the rest is not secret.
      INIT_ENABLED: "true"
      # vpn.sakul-flee.de is the Cloudflare-proxied UI name; WireGuard is UDP
      # and cannot traverse the proxy. wg.sakul-flee.de is DNS-only and is the
      # record cloudflare-ddns keeps pointing at the WAN address.
      INIT_HOST: wg.sakul-flee.de
      INIT_PORT: "51820"
      # Homelab resolver first (split-horizon names), public resolver as a
      # fallback so a dead CoreDNS degrades to "internal names fail" instead of
      # taking all name resolution down with it.
      INIT_DNS: 192.168.178.200,9.9.9.9
      # Keep the tunnel subnet: Caddy's VPN-only gate matches 100.64.0.0/10.
      INIT_IPV4_CIDR: 100.64.0.0/24
      INIT_IPV6_CIDR: fd42:1::/64
      INIT_ALLOWED_IPS: 0.0.0.0/0,::/0
    volumes:
      - /srv/docker/wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
