# Keep Fluxer's upstream compose files vendored and only override what the
# homelab host needs: bind-mounted data and the shared proxy network.
services:
  edge:
    container_name: fluxer-edge
    # The upstream proxy overlay sets this too, but Compose `include` does not
    # reliably merge an included service environment over the base file. State
    # it here so the container always serves plain HTTP on 8080.
    environment: !override
      FLUXER_EDGE_SITE_ADDRESS: ":8080"
      FLUXER_EDGE_ENCODE: "zstd gzip"
      FLUXER_EDGE_TRUSTED_PROXIES: "private_ranges"
      FLUXER_ADMIN_BASE_PATH: "/admin"
    networks:
      fluxer:
      proxy:
    volumes: !override
      - ./vendor/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/docker/fluxer/edge-data:/data
      - /srv/docker/fluxer/edge-config:/config

  postgres:
    container_name: fluxer-postgres
    volumes: !override
      - /srv/docker/fluxer/postgres-data:/var/lib/postgresql/data

  valkey:
    volumes: !override
      - /srv/docker/fluxer/valkey-data:/data

  nats:
    volumes: !override
      - /srv/docker/fluxer/nats-data:/data

  meilisearch:
    volumes: !override
      - /srv/docker/fluxer/meilisearch-data:/meili_data

  seaweedfs:
    volumes: !override
      - /srv/docker/fluxer/seaweedfs-data:/data

networks:
  proxy:
    external: true
