name: coredns

services:
  coredns:
    image: coredns/coredns:1.12.1
    container_name: coredns
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
    ports:
      - "192.168.178.200:53:53/tcp"
      - "192.168.178.200:53:53/udp"
