name: coredns

services:
  coredns:
    image: coredns/coredns:1.12.1
    container_name: coredns
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      LAN_IP: ${LAN_IP:-192.168.178.200}
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
    ports:
      - "${LAN_IP:-192.168.178.200}:53:53/tcp"
      - "${LAN_IP:-192.168.178.200}:53:53/udp"
