name: ollama

services:
  ollama:
    build: .
    image: homelab/ollama:local
    container_name: ollama
    restart: unless-stopped
    environment:
      # Listen on the dedicated homelab-ai network so Paperless, OpenCode and
      # Hermes can reach ollama:11434. There is no host port and no proxy
      # membership.
      OLLAMA_HOST: 0.0.0.0:11434
      # iGPU attempt: RADV via Vulkan. The derived image installs the Mesa ICD
      # and the host's /dev/dri is passed below.
      OLLAMA_VULKAN: "1"
      OLLAMA_IGPU_ENABLE: "1"
      # Keep the generation and embedding models resident for a while, but let
      # them unload when nothing uses them. One request at a time keeps the
      # KV cache from multiplying.
      OLLAMA_KEEP_ALIVE: 10m
      # One resident model only. The 680M has no real VRAM, so Ollama holds the
      # weights in GTT, which is ordinary system RAM; two models at 64k is
      # ~17 GB of it. A concurrent request at a different context (or a second
      # model) is enough on its own to push the host into swap, and swapped-out
      # GPU pages make inference return garbage rather than fail.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # OpenCode and Hermes require at least 64k for tool use. Paperless sends
      # its own num_ctx=8192 for suggestions/chat, so it does not need this
      # larger default; it may cause Ollama to reload between consumers.
      OLLAMA_CONTEXT_LENGTH: "65536"
    # The AMD iGPU is an amdgpu render node. If Vulkan is not detected, Ollama
    # logs the fallback and runs on the CPU. To force CPU-only, remove this
    # block and the two VULKAN/IGPU variables above.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Models are re-downloadable and intentionally excluded from restic.
      - /srv/docker/ollama:/root/.ollama
    # No published port: the API has no authentication, so only the
    # homelab-ai network may reach it. Use `docker exec` for host-side checks.
    healthcheck:
      # OLLAMA_HOST points at 0.0.0.0 for the server; the CLI needs a real
      # destination for this probe.
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - homelab-ai

networks:
  homelab-ai:
    external: true
