name: ollama

services:
  ollama:
    # Upstream image, CPU only. The 680M has 512 MB of dedicated VRAM, so the
    # weights live in GTT (ordinary system RAM). When a build drives the host
    # low on memory those pages get swapped out and Vulkan returns garbage
    # instead of failing: "<unused49>" for Gemma, "//////" for Qwen3.5. Q4_K_M
    # on the CPU is both correct and faster here (8.8 tok/s against 2.0), so
    # the iGPU buys nothing. Re-enabling it needs the Mesa Dockerfile from
    # 87f6eeb4 plus the `devices:`/OLLAMA_VULKAN block. See docs/operations.md.
    image: ollama/ollama:0.40.19
    container_name: ollama
    restart: unless-stopped
    environment:
      # Listen on the dedicated homelab-ai network so Paperless and OpenCode
      # can reach ollama:11434. There is no host port and no proxy membership.
      OLLAMA_HOST: 0.0.0.0:11434
      # One resident model only. Two at 64k is ~13 GB of anonymous memory on a
      # 30 GB host that also runs Rust builds, and reloading is cheaper than
      # swapping.
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Paperless and OpenCode both ask for 64k, so they share one instance
      # instead of making Ollama load the model at two contexts.
      OLLAMA_CONTEXT_LENGTH: "65536"
    volumes:
      # Models are re-downloadable and intentionally excluded from restic.
      - /srv/docker/ollama:/root/.ollama
    # No published port: the API has no authentication, so only the
    # homelab-ai network may reach it. Use `docker exec` for host-side checks.
    healthcheck:
      # OLLAMA_HOST points at 0.0.0.0 for the server; the CLI needs a real
      # destination for this probe.
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - homelab-ai

networks:
  homelab-ai:
    external: true
