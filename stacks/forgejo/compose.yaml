name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.5
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"

      FORGEJO__DEFAULT__APP_NAME: HomeLab
      FORGEJO__DEFAULT__RUN_MODE: prod
      FORGEJO__DEFAULT__RUN_USER: git
      FORGEJO__DEFAULT__WORK_PATH: /data

      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD_URI: file:/run/secrets/forgejo_db_password
      FORGEJO__database__SSL_MODE: disable

      FORGEJO__repository__ROOT: /data/git/gitea-repositories
      FORGEJO__repository__MAX_CREATION_LIMIT: "0"
      FORGEJO__repo-archive__PATH: /data/repo-archive

      FORGEJO__server__DOMAIN: forgejo.sakul-flee.de
      FORGEJO__server__ROOT_URL: https://forgejo.sakul-flee.de/
      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__HTTP_ADDR: 0.0.0.0
      FORGEJO__server__HTTP_PORT: "3000"
      # The old volume is mounted at /data and already has the git/, lfs/,
      # attachments/, avatars/ and packages/ layout. Docker's default is
      # /data/gitea, which would send those paths one level too deep.
      FORGEJO__server__APP_DATA_PATH: /data
      FORGEJO__server__SSH_DOMAIN: forgejo.sakul-flee.de
      FORGEJO__server__SSH_PORT: "22"
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      # Use the image's OpenSSH daemon, not Forgejo's built-in SSH server. The
      # OpenSSH daemon reads the preserved /data/ssh/ssh_host_* keys as root, so
      # existing known_hosts entries stay valid. Forgejo writes its users' keys
      # to git's authorized_keys file.
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__DISABLE_SSH: "false"
      FORGEJO__server__SSH_CREATE_AUTHORIZED_KEYS_FILE: "true"
      FORGEJO__server__LFS_START_SERVER: "true"
      FORGEJO__server__LFS_JWT_SECRET_URI: file:/run/secrets/forgejo_lfs_secret
      FORGEJO__server__REVERSE_PROXY_TRUSTED_PROXIES: "172.16.0.0/12"

      FORGEJO__security__SECRET_KEY_URI: file:/run/secrets/forgejo_secret_key
      FORGEJO__security__INTERNAL_TOKEN_URI: file:/run/secrets/forgejo_internal_token
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__GLOBAL_TWO_FACTOR_REQUIREMENT: all

      FORGEJO__oauth2__JWT_SECRET_URI: file:/run/secrets/forgejo_jwt_secret

      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtps
      FORGEJO__mailer__SMTP_ADDR: smtp.purelymail.com
      FORGEJO__mailer__SMTP_PORT: "465"
      FORGEJO__mailer__USER: lweber@sakul-flee.de
      FORGEJO__mailer__FROM: forgejo@sakul-flee.de
      FORGEJO__mailer__PASSWD_URI: file:/run/secrets/forgejo_smtp_password

      FORGEJO__gpg__PATH: /data/git/.gnupg
      FORGEJO__gpg__KEY_ID: D273FC783753BF71CC38F49F96B09A0A3DDB2CD8
      FORGEJO__gpg__ALGORITHM: openpgp

      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__service__REGISTER_EMAIL_CONFIRM: "true"
      FORGEJO__service__ENABLE_NOTIFY_MAIL: "true"
      FORGEJO__service__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__service__ENABLE_PUSH_CREATE_ORG: "true"

      FORGEJO__admin__DEFAULT_EMAIL_NOTIFICATIONS: enabled
      FORGEJO__admin__SEND_NOTIFICATION_EMAIL_ON_NEW_USER: "true"
      FORGEJO__admin__DISABLE_REGULAR_ORG_CREATION: "true"

    secrets:
      - forgejo_db_password
      - forgejo_secret_key
      - forgejo_internal_token
      - forgejo_jwt_secret
      - forgejo_lfs_secret
      - forgejo_smtp_password

    volumes:
      - /srv/docker/forgejo/data:/data
      - /srv/docker/forgejo/custom:/data/gitea
      - /srv/docker/forgejo/archive:/data/repo-archive

    ports:
      - "${FORGEJO_SSH_HOST_PORT:-22}:22"
      - "127.0.0.1:3000:3000"

    networks:
      - proxy
      - default

  db:
    image: postgres:18-alpine
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD_FILE: /run/secrets/forgejo_db_password
    secrets:
      - forgejo_db_password
    volumes:
      # PostgreSQL 18+ expects the mount at /var/lib/postgresql, not at
      # /var/lib/postgresql/data. The image then puts the cluster in a
      # major-version-specific subdirectory, which is what makes pg_upgrade
      # work without crossing a mount boundary.
      - /srv/docker/forgejo/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    networks:
      - default

networks:
  proxy:
    external: true
  default:

secrets:
  forgejo_db_password:
    file: /run/homelab/secrets/forgejo/forgejo_db_password
  forgejo_secret_key:
    file: /run/homelab/secrets/forgejo/forgejo_secret_key
  forgejo_internal_token:
    file: /run/homelab/secrets/forgejo/forgejo_internal_token
  forgejo_jwt_secret:
    file: /run/homelab/secrets/forgejo/forgejo_jwt_secret
  forgejo_lfs_secret:
    file: /run/homelab/secrets/forgejo/forgejo_lfs_secret
  forgejo_smtp_password:
    file: /run/homelab/secrets/forgejo/forgejo_smtp_password
