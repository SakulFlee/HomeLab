name: forgejo-runner

services:
  runner:
    image: code.forgejo.org/forgejo/runner:13
    container_name: forgejo-runner
    restart: unless-stopped
    user: "0:0"
    command: ["/bin/forgejo-runner", "daemon", "--config", "/config.yaml"]
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/docker/forgejo-runner:/data
      # Not under /run: these are rendered secrets on tmpfs, so a reboot left
      # the container starting before render-secrets.sh had recreated the
      # file, and Docker replaced the missing source with a directory. A
      # persistent path removes the race. The tree is excluded from backups
      # and sits on the LUKS root like the hostapd config.
      - /srv/docker/forgejo-runner/config.yaml:/config.yaml:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
