name: caddy

services:
  caddy:
    build:
      context: .
    image: homelab/caddy:local
    container_name: caddy
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        export CF_API_TOKEN="$$(cat /run/secrets/cloudflare_api_token)"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      HOMELAB_LAN_IP: ${LAN_IP:-192.168.178.200}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/docker/caddy:/data
      - /run/homelab/secrets:/run/secrets:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
