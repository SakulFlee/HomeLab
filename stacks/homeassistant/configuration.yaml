# Managed in the repository. deploy.sh installs this file over
# /srv/docker/homeassistant/configuration.yaml and restarts the container when
# it differs, so edits made on the host do not survive a deploy. Integrations
# configured through the UI live in .storage and are not touched.
#
# default_config is expanded by hand to leave out:
#  * bluetooth: host networking exposes the host's adapter through USB, and HA
#    then asks for NET_ADMIN/NET_RAW to manage it. Those capabilities in the
#    host network namespace would also allow rewriting the host firewall, and
#    unloading the driver does not help because the USB device stays visible.
#  * cloud: Nabu Casa is not used.
# The list is default_config's manifest minus those two; a new default
# integration in a future release has to be added here explicitly.
#
# There is deliberately no http: block. HA 2026.x migrates it into
# .storage/http on first boot and ignores YAML for it afterwards; deploy.sh
# reconciles the reverse-proxy keys in that store.
assist_pipeline:
conversation:
dhcp:
energy:
file:
go2rtc:
history:
homeassistant_alerts:
logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
usage_prediction:
usb:
webhook:
zeroconf:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
