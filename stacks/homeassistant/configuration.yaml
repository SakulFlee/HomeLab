# Managed in the repository. deploy.sh installs this file over
# /srv/docker/homeassistant/configuration.yaml and restarts the container when
# it differs, so edits made on the host do not survive a deploy. Integrations
# configured through the UI live in .storage and are not touched.
#
# default_config is expanded by hand for two reasons:
#  * bluetooth: the host's MT7921 exposes hci0 and host networking makes it
#    visible here, so Home Assistant starts a Bluetooth manager and logs a
#    NET_ADMIN/NET_RAW permission error every few seconds. Fixing that means
#    granting NET_ADMIN to a container that shares the host network namespace,
#    which would let it rewrite the host firewall. Not worth it until a
#    Bluetooth proxy or a real BLE device exists.
#  * cloud: Nabu Casa is not used.
# The list below is default_config's manifest minus those two. A new default
# integration in a future release has to be added here explicitly.
assist_pipeline:
conversation:
dhcp:
energy:
file:
go2rtc:
history:
homeassistant_alerts:
logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
usage_prediction:
usb:
webhook:
zeroconf:

http:
  # Caddy is the only client in front of Home Assistant and it always sends
  # X-Forwarded-For. Without a trusted proxy, HA answers 400 to every request.
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
