# Managed in the repository. deploy.sh installs this file over
# /srv/docker/homeassistant/configuration.yaml and restarts the container when
# it differs, so edits made on the host do not survive a deploy. Integrations
# configured through the UI live in .storage and are not touched.
#
# default_config stays. Expanding it by hand (to leave bluetooth out) silently
# stopped the http: block below from being applied, and HA then answers 400 to
# every proxied request. The host's Bluetooth adapter is hidden from the
# container instead; see the /sys/class/bluetooth mount in compose.yaml.
default_config:

http:
  # Caddy is the only client in front of Home Assistant and it always sends
  # X-Forwarded-For. Without a trusted proxy, HA answers 400 to every request.
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
