# Seeded into /srv/docker/hermes/config.yaml by prepare-data.sh, and only when
# that file does not exist yet. After the first boot Hermes owns the runtime
# copy; edit it through the webapp or `docker exec hermes hermes config set`
# and restart the container. Changes to this file do not re-apply.

# Default main model: the local Ollama model. `custom:local` refers to the
# `providers.local` entry below, so no model.base_url is set here (a stale
# base_url would win over the provider's `api`). OpenCode Go stays configured
# through OPENCODE_GO_API_KEY and is selectable per session.
# Back to the cloud model: `/model opencode-go:deepseek-v4.1-flash --global`
# or the dashboard's Models page.
#
# qwen3.5:9b, not gemma4:12b-it-qat: Gemma 4 on the Vulkan backend emits
# "<unused49>" instead of text (ollama#15261, llama.cpp#21516). It is
# intermittent, so it looks like a sudden host regression. qwen3.5 is dense and
# skips the corrupt path; it is slower (~2 tok/s vs ~6) but it tool-calls
# reliably.
model:
  provider: custom:local
  default: qwen3.5:9b
  api_mode: chat_completions

# Local provider. Hermes requires at least 64k context for tool use, matching
# Ollama's OLLAMA_CONTEXT_LENGTH.
providers:
  local:
    api: http://ollama:11434/v1
    transport: chat_completions
    default_model: qwen3.5:9b
    context_length: 65536

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: "https://hermes.sakul-flee.de"

dashboard:
  # Caddy is the only source of X-Forwarded-* headers. The webapp reads the
  # same list, and without it sign-in cookies are built for http:// and the
  # https callback fails.
  trusted_proxies:
    - "172.16.0.0/12"

terminal:
  # local means the container's own shell, not the host. There is no Docker
  # socket mounted, so the docker backend is not available.
  backend: local
  cwd: /workspace

desktop:
  repo_scan_enabled: true
  repo_scan_roots:
    - /workspace
