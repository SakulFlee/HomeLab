name: hermes

services:
  hermes:
    # Upstream image, pinned to a stable release. Renovate only tracks plain
    # vX.Y.Z tags; see the package rule in renovate.json.
    image: nousresearch/hermes-agent:v0.23.4
    container_name: hermes
    restart: unless-stopped
    # The image's /init has to start as root so it can chown /opt/data to
    # HERMES_UID/GID, then it drops to that user for the gateway. Do not set
    # `user:` here or the volume setup is skipped.
    command: ["gateway", "run"]
    # HERMES_DASHBOARD_BASIC_AUTH_PASSWORD, HERMES_DASHBOARD_BASIC_AUTH_SECRET,
    # OPENCODE_GO_API_KEY and FORGEJO_TOKEN.
    env_file:
      - path: /run/homelab/secrets/hermes.env
        required: true
    environment:
      HERMES_UID: "991"
      HERMES_GID: "991"
      # The image defaults this to /opt/data. /workspace is the one other host
      # path the file tools may write; the terminal backend can still write
      # anywhere inside the container.
      HERMES_WRITE_SAFE_ROOT: "/opt/data:/workspace"
      # The webapp signs in through the dashboard basic-auth provider; the
      # password and session secret come from hermes.env.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: sakulflee
    volumes:
      - /srv/docker/hermes:/opt/data
      - /srv/docker/hermes/workspace:/workspace
    # Chromium (the browser tool) needs more than Docker's 64 MB /dev/shm.
    shm_size: 1gb
    # The gateway plus browser sessions; the host has 16 cores and 30 GB.
    mem_limit: 4g
    cpus: 2.0
    # `deploy.sh` uses `compose up --wait`, so this is what marks the stack
    # healthy. The webapp refuses to start when its auth provider is missing,
    # which the TCP check catches even though the gateway itself is up.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /command/s6-svstat /run/hermes-service/gateway-default | grep -q '^up'
          && /opt/hermes/.venv/bin/python -c "import socket; socket.create_connection(('127.0.0.1', 9120), 3).close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - proxy
      - homelab-ai

networks:
  proxy:
    external: true
  homelab-ai:
    external: true
