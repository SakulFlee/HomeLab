name: hytale

services:
  hytale:
    build:
      context: .
    image: homelab/hytale:local
    container_name: hytale
    restart: unless-stopped
    user: "989:989"
    stop_grace_period: 5m
    mem_limit: 8g
    ports:
      - "${HYTALE_PORT:-5520}:5520/udp"
    volumes:
      - /srv/docker/hytale/data:/data
      - /srv/docker/hytale/secrets:/secrets
      # Must exist before the container starts. It is the machine id that
      # auth.enc was encrypted under; losing it costs a device-code login.
      - /srv/docker/hytale/machine-id:/etc/machine-id:ro
    healthcheck:
      # A bound UDP socket is not proof that the server is authenticated, but it
      # is a real liveness check: the Hytale JVM only opens 5520 after startup.
      test: ["CMD-SHELL", "ss -lun | grep -q ':5520 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
