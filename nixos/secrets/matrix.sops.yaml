# Matrix Synapse + Bridge Secrets
# Fill in the values below, then encrypt with:
#   sops -e -i nixos/secrets/matrix.sops.yaml
#
# Required secrets:
#   database_password: PostgreSQL password for matrix-synapse user
#   registration_shared_secret: Synapse registration secret (generate with: openssl rand -hex 32)
#   signing_key: Synapse signing key path (will be generated on first run, or provide your own)
#   discord_bridge_token: mautrix-discord bridge environment file path
#   whatsapp_bridge_token: mautrix-whatsapp bridge environment file path

database_password: REPLACE_WITH_DATABASE_PASSWORD
registration_shared_secret: REPLACE_WITH_REGISTRATION_SECRET
signing_key: REPLACE_WITH_SIGNING_KEY_PATH
discord_bridge_token: /var/lib/mautrix-discord/discord-bridge.env
whatsapp_bridge_token: /var/lib/mautrix-whatsapp/whatsapp-bridge.env
