when:
  - event: [push, pull_request]

steps:
  tofu-plan:
    image: nixos/nix:latest
    environment:
      PROXMOX_TOKEN_ID:
        from_secret: PROXMOX_TOKEN_ID
      PROXMOX_TOKEN_SECRET:
        from_secret: PROXMOX_TOKEN_SECRET
    commands:
      - nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#opentofu
      - cd tofu && tofu init && tofu plan -no-color
        -var="proxmox_token_id=$PROXMOX_TOKEN_ID"
        -var="proxmox_token_secret=$PROXMOX_TOKEN_SECRET"
        -var="bastion_host=192.168.178.200"
        -var="ssh_private_key_path=/dev/null"
    when:
      - event: pull_request
      - event: push
        branch: main

  tofu-apply:
    image: nixos/nix:latest
    environment:
      PROXMOX_TOKEN_ID:
        from_secret: PROXMOX_TOKEN_ID
      PROXMOX_TOKEN_SECRET:
        from_secret: PROXMOX_TOKEN_SECRET
      SSH_KEY:
        from_secret: SSH_KEY
      FORGEJO_TOKEN:
        from_secret: FORGEJO_TOKEN
    commands:
      - nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#opentofu
      - printf "%s" "$SSH_KEY" > /tmp/tofu-deploy && chmod 600 /tmp/tofu-deploy
      - cd tofu && tofu init && tofu apply -auto-approve -no-color
        -var="proxmox_token_id=$PROXMOX_TOKEN_ID"
        -var="proxmox_token_secret=$PROXMOX_TOKEN_SECRET"
        -var="bastion_host=192.168.178.200"
        -var="ssh_private_key_path=/tmp/tofu-deploy"
      - git config user.name "woodpecker"
      - git config user.email "ci@homelab"
      - git remote set-url origin https://sakulflee:$FORGEJO_TOKEN@forgejo.sakul-flee.de/sakulflee/HomeLab.git
      - git add terraform.tfstate
      - 'git diff --staged --quiet || git commit -m "tofu: update state [skip ci]"'
      - git push origin HEAD:$CI_COMMIT_BRANCH
    when:
      - event: push
        branch: main

