steps:
  deploy:
    image: alpine/ansible
    environment:
      SSH_KEY:
        from_secret: SSH_KEY
    commands:
      - echo "$SSH_KEY" > private_key
      - chmod 0600 private_key
      - |
        ssh \
          -o StrictHostKeyChecking=no \
          -o ProxyCommand="ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.178.200 -W %h:%p" \
          root@10.0.0.101 hostname
      - ansible-playbook -i inventory.ini playbook.yml --private-key private_key
